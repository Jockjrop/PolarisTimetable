<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>确认识别结果</title>
    <style id="theme-vars">
/* ============================================
   Polaris 课程表 — Brand Design Tokens
   ============================================ */

:root {
  /* — Primary Brand — */
  --color-brand: #2563EB;
  --color-brand-hover: #1D4ED8;
  --color-brand-light: #DBEAFE;
  --color-brand-subtle: #EFF6FF;

  /* — Semantic State Colors — */
  --state-success: #059669;
  --state-success-bg: #ECFDF5;
  --state-warning: #D97706;
  --state-warning-bg: #FFFBEB;
  --state-error: #DC2626;
  --state-error-bg: #FEF2F2;
  --state-info: #2563EB;
  --state-info-bg: #EFF6FF;

  /* — Course Palette (by weekday) — */
  --course-mon: #2563EB;
  --course-mon-bg: #EAF2FF;
  --course-tue: #E8645A;
  --course-tue-bg: #FFEDEE;
  --course-wed: #0D9488;
  --course-wed-bg: #EAF8F1;
  --course-thu: #7C3AED;
  --course-thu-bg: #F1EAFE;
  --course-fri: #D97706;
  --course-fri-bg: #FFF3D9;
  --course-sat: #EC4899;
  --course-sat-bg: #FDF2F8;

  /* — Surfaces — */
  --surface-page: #F6F7FB;
  --surface-card: #FFFFFF;
  --surface-elevated: #FFFFFF;
  --surface-overlay: rgba(15, 23, 42, 0.5);

  /* — Text — */
  --text-primary: #172033;
  --text-secondary: #667085;
  --text-tertiary: #98A2B3;
  --text-inverse: #FFFFFF;
  --text-brand: #2563EB;

  /* — Borders — */
  --border-default: #D9DFEA;
  --border-subtle: #E5E7EB;
  --border-brand: #2563EB;

  /* — Typography — */
  --font-family: 'Inter', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
  --font-size-xs: 11px;
  --font-size-sm: 13px;
  --font-size-base: 15px;
  --font-size-lg: 17px;
  --font-size-xl: 20px;
  --font-size-2xl: 24px;
  --font-size-3xl: 28px;
  --line-height-tight: 1.25;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.625;
  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  /* — Radius — */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* — Spacing — */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;
  --space-4xl: 40px;

  /* — Shadow — */
  --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.03);
  --shadow-elevated: 0 4px 12px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.04);
  --shadow-float: 0 10px 25px rgba(0, 0, 0, 0.08), 0 4px 10px rgba(0, 0, 0, 0.04);

  /* — Bottom Nav Height — */
  --nav-height: 64px;
  --status-bar-height: 44px;

  /* — Schedule Grid — */
  --schedule-time-col: 48px;
  --schedule-day-col: 68px;
  --schedule-row-height: 56px;
  --schedule-gap: 2px;
}

/* — Typography Utility Classes — */
.text-xs { font-size: var(--font-size-xs); line-height: var(--line-height-tight); }
.text-sm { font-size: var(--font-size-sm); line-height: var(--line-height-normal); }
.text-base { font-size: var(--font-size-base); line-height: var(--line-height-normal); }
.text-lg { font-size: var(--font-size-lg); line-height: var(--line-height-normal); }
.text-xl { font-size: var(--font-size-xl); line-height: var(--line-height-tight); }
.text-2xl { font-size: var(--font-size-2xl); line-height: var(--line-height-tight); }
.text-3xl { font-size: var(--font-size-3xl); line-height: var(--line-height-tight); }

.font-medium { font-weight: var(--font-weight-medium); }
.font-semibold { font-weight: var(--font-weight-semibold); }
.font-bold { font-weight: var(--font-weight-bold); }

.text-primary { color: var(--text-primary); }
.text-secondary { color: var(--text-secondary); }
.text-tertiary { color: var(--text-tertiary); }
.text-brand { color: var(--text-brand); }

/* — Color Utility Classes — */
.bg-brand { background-color: var(--color-brand); }
.bg-brand-light { background-color: var(--color-brand-light); }
.bg-brand-subtle { background-color: var(--color-brand-subtle); }
.bg-page { background-color: var(--surface-page); }
.bg-card { background-color: var(--surface-card); }

/* — Radius Utility Classes — */
.rounded-sm { border-radius: var(--radius-sm); }
.rounded-md { border-radius: var(--radius-md); }
.rounded-lg { border-radius: var(--radius-lg); }
.rounded-xl { border-radius: var(--radius-xl); }
.rounded-full { border-radius: var(--radius-full); }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--text-primary);
    --color-secondary: var(--text-secondary);
  }
  @layer base {
    body { background: var(--text-background); color: var(--text-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main>

      <!-- Top Bar -->
      <div class="top-bar">
        <button class="back-btn" data-dom-id="btn-back-import" aria-label="返回">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>
        <span class="title">确认识别结果</span>
        <button class="log-btn">查看日志</button>
      </div>

      <!-- Summary Header -->
      <div class="summary-header">
        <div class="stats-row">
          <div class="stat-item">
            <span class="stat-number brand">12</span>
            <span class="stat-label">识别课程</span>
          </div>
          <div class="stat-item">
            <span class="stat-number warning">2</span>
            <span class="stat-label">低置信度</span>
          </div>
          <div class="stat-item">
            <span class="stat-number success">0</span>
            <span class="stat-label">识别失败</span>
          </div>
        </div>
        <div class="source-file">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
          <span class="file-name">苏国强(2025-2026-2)课表.pdf</span>
        </div>
      </div>

      <!-- Scrollable Course List -->
      <div class="course-list">

        <div class="section-group-label">按星期分组</div>

        <!-- Monday -->
        <div class="day-group">
          <div class="day-label">周一</div>
          <div class="course-cards">
            <div class="course-card" style="border-left-color: var(--course-mon);">
              <div class="card-body">
                <div class="course-name">高等数学</div>
                <div class="course-meta">1-2节 · 教A-301</div>
              </div>
            </div>
            <div class="course-card" style="border-left-color: var(--course-tue);">
              <div class="card-body">
                <div class="course-name">大学物理实验</div>
                <div class="course-meta">3-4节 · 实验楼B-205</div>
              </div>
            </div>
          </div>
        </div>

        <!-- Tuesday -->
        <div class="day-group">
          <div class="day-label">周二</div>
          <div class="course-cards">
            <div class="course-card" style="border-left-color: var(--course-wed);">
              <div class="card-body">
                <div class="course-name">程序设计基础</div>
                <div class="course-meta">1-2节 · 教B-401</div>
              </div>
            </div>
            <div class="course-card low-confidence" style="border-left-color: var(--course-thu);">
              <span class="low-confidence-badge">低置信度</span>
              <div class="card-body">
                <div class="course-name">数据结构(双语)</div>
                <div class="course-meta">5-6节 · 教A-502</div>
              </div>
            </div>
          </div>
        </div>

        <!-- Wednesday -->
        <div class="day-group">
          <div class="day-label">周三</div>
          <div class="course-cards">
            <div class="course-card" style="border-left-color: var(--course-thu);">
              <div class="card-body">
                <div class="course-name">大学英语(三)</div>
                <div class="course-meta">3-4节 · 外语楼201</div>
              </div>
            </div>
          </div>
        </div>

        <!-- Thursday -->
        <div class="day-group">
          <div class="day-label">周四</div>
          <div class="course-cards">
            <div class="course-card" style="border-left-color: var(--course-fri);">
              <div class="card-body">
                <div class="course-name">线性代数</div>
                <div class="course-meta">1-2节 · 教C-102</div>
              </div>
            </div>
            <div class="course-card" style="border-left-color: var(--course-mon);">
              <div class="card-body">
                <div class="course-name">思想政治理论</div>
                <div class="course-meta">7-8节 · 教A-101</div>
              </div>
            </div>
          </div>
        </div>

        <!-- Friday -->
        <div class="day-group">
          <div class="day-label">周五</div>
          <div class="course-cards">
            <div class="course-card" style="border-left-color: var(--course-sat);">
              <div class="card-body">
                <div class="course-name">体育(篮球)</div>
                <div class="course-meta">3-4节 · 体育馆</div>
              </div>
            </div>
          </div>
        </div>

      </div>

      <!-- Bottom Action Bar -->
      <div class="bottom-action-bar">
        <button class="btn-confirm" data-dom-id="btn-confirm-save">确认保存</button>
        <button class="btn-reimport" data-dom-id="btn-back-import">重新导入</button>
      </div>

    </main>
    <script>lucide.createIcons();</script>

    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: var(--font-family);
        background: var(--surface-page);
        color: var(--text-primary);
        max-width: 375px;
        margin: 0 auto;
        min-height: 100vh;
        position: relative;
        padding-bottom: 100px;
        -webkit-font-smoothing: antialiased;
      }

      /* Top Bar */
      .top-bar {
        position: sticky;
        top: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--surface-card);
        padding: 14px 16px;
        border-bottom: 1px solid var(--border-default);
      }
      .top-bar .back-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        cursor: pointer;
        color: var(--text-primary);
        background: none;
        border: none;
      }
      .top-bar .title {
        font-size: var(--font-size-lg);
        font-weight: var(--font-weight-semibold);
        color: var(--text-primary);
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
      }
      .top-bar .log-btn {
        font-size: var(--font-size-sm);
        color: var(--text-brand);
        background: none;
        border: none;
        cursor: pointer;
        font-weight: var(--font-weight-medium);
      }

      /* Summary Header */
      .summary-header {
        position: sticky;
        top: 53px;
        z-index: 30;
        background: var(--surface-card);
        padding: 16px 20px;
        border-bottom: 1px solid var(--border-default);
      }
      .stats-row {
        display: flex;
        align-items: center;
        justify-content: space-around;
        gap: 12px;
      }
      .stat-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
      }
      .stat-number {
        font-size: var(--font-size-2xl);
        font-weight: var(--font-weight-bold);
        line-height: var(--line-height-tight);
      }
      .stat-number.brand { color: var(--color-brand); }
      .stat-number.warning { color: var(--state-warning); }
      .stat-number.success { color: var(--state-success); }
      .stat-label {
        font-size: var(--font-size-xs);
        color: var(--text-secondary);
      }
      .source-file {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 12px;
        justify-content: center;
      }
      .source-file .file-name {
        font-size: var(--font-size-sm);
        color: var(--text-tertiary);
      }
      .source-file svg {
        width: 14px;
        height: 14px;
        color: var(--text-tertiary);
        flex-shrink: 0;
      }

      /* Course List */
      .course-list {
        padding: 0 0 120px 0;
      }
      .section-group-label {
        font-size: var(--font-size-sm);
        color: var(--text-secondary);
        font-weight: var(--font-weight-medium);
        padding: var(--space-md) 20px var(--space-sm);
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
      .day-group {
        padding: var(--space-sm) 20px 0;
      }
      .day-group + .day-group {
        margin-top: var(--space-lg);
      }
      .day-label {
        font-size: 14px;
        font-weight: var(--font-weight-semibold);
        color: var(--text-primary);
        padding: var(--space-sm) 0 6px;
      }
      .course-cards {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      /* Course Card */
      .course-card {
        display: flex;
        align-items: flex-start;
        background: var(--surface-card);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-md);
        padding: 12px 14px;
        border-left: 3px solid var(--course-mon);
        position: relative;
        transition: box-shadow 0.15s ease;
      }
      .course-card .card-body {
        flex: 1;
        min-width: 0;
      }
      .course-card .course-name {
        font-size: 14px;
        font-weight: var(--font-weight-semibold);
        color: var(--text-primary);
        line-height: 1.35;
      }
      .course-card .course-meta {
        font-size: var(--font-size-sm);
        color: var(--text-secondary);
        margin-top: 4px;
        line-height: var(--line-height-normal);
      }

      /* Low confidence card */
      .course-card.low-confidence .course-name {
        text-decoration: underline;
        text-decoration-style: dashed;
        text-decoration-color: var(--state-warning);
        text-underline-offset: 3px;
      }
      .low-confidence-badge {
        position: absolute;
        top: 8px;
        right: 10px;
        background: var(--state-warning-bg);
        color: var(--state-warning);
        font-size: 10px;
        font-weight: var(--font-weight-medium);
        border-radius: var(--radius-full);
        padding: 2px 8px;
        line-height: 1.4;
        white-space: nowrap;
      }

      /* Bottom Action Bar */
      .bottom-action-bar {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        max-width: 375px;
        background: var(--surface-card);
        border-top: 1px solid var(--border-default);
        padding: 14px 20px 28px;
        z-index: 40;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .btn-confirm {
        width: 100%;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--color-brand);
        color: var(--text-inverse);
        font-size: var(--font-size-lg);
        font-weight: var(--font-weight-semibold);
        border: none;
        border-radius: var(--radius-lg);
        cursor: pointer;
        transition: background 0.15s ease;
      }
      .btn-confirm:active {
        background: var(--color-brand-hover);
      }
      .btn-reimport {
        font-size: var(--font-size-sm);
        color: var(--text-secondary);
        background: none;
        border: none;
        cursor: pointer;
        text-decoration: none;
        font-weight: var(--font-weight-medium);
      }
      .btn-reimport:active {
        color: var(--text-primary);
      }
    </style>
</body>
</html>
