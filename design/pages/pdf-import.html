<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导入课表 - Polaris课程表</title>
    <style id="theme-vars">
/* ============================================
   Polaris 课程表 — Brand Design Tokens
   ============================================ */

:root {
  /* — Primary Brand — */
  --color-brand: #2563EB;
  --color-brand-hover: #1D4ED8;
  --color-brand-light: #DBEAFE;
  --color-brand-subtle: #EFF6FF;

  /* — Semantic State Colors — */
  --state-success: #059669;
  --state-success-bg: #ECFDF5;
  --state-warning: #D97706;
  --state-warning-bg: #FFFBEB;
  --state-error: #DC2626;
  --state-error-bg: #FEF2F2;
  --state-info: #2563EB;
  --state-info-bg: #EFF6FF;

  /* — Course Palette (by weekday) — */
  --course-mon: #2563EB;
  --course-mon-bg: #EAF2FF;
  --course-tue: #E8645A;
  --course-tue-bg: #FFEDEE;
  --course-wed: #0D9488;
  --course-wed-bg: #EAF8F1;
  --course-thu: #7C3AED;
  --course-thu-bg: #F1EAFE;
  --course-fri: #D97706;
  --course-fri-bg: #FFF3D9;
  --course-sat: #EC4899;
  --course-sat-bg: #FDF2F8;

  /* — Surfaces — */
  --surface-page: #F6F7FB;
  --surface-card: #FFFFFF;
  --surface-elevated: #FFFFFF;
  --surface-overlay: rgba(15, 23, 42, 0.5);

  /* — Text — */
  --text-primary: #172033;
  --text-secondary: #667085;
  --text-tertiary: #98A2B3;
  --text-inverse: #FFFFFF;
  --text-brand: #2563EB;

  /* — Borders — */
  --border-default: #D9DFEA;
  --border-subtle: #E5E7EB;
  --border-brand: #2563EB;

  /* — Typography — */
  --font-family: 'Inter', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
  --font-size-xs: 11px;
  --font-size-sm: 13px;
  --font-size-base: 15px;
  --font-size-lg: 17px;
  --font-size-xl: 20px;
  --font-size-2xl: 24px;
  --font-size-3xl: 28px;
  --line-height-tight: 1.25;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.625;
  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  /* — Radius — */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* — Spacing — */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;
  --space-4xl: 40px;

  /* — Shadow — */
  --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.03);
  --shadow-elevated: 0 4px 12px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.04);
  --shadow-float: 0 10px 25px rgba(0, 0, 0, 0.08), 0 4px 10px rgba(0, 0, 0, 0.04);

  /* — Bottom Nav Height — */
  --nav-height: 64px;
  --status-bar-height: 44px;

  /* — Schedule Grid — */
  --schedule-time-col: 48px;
  --schedule-day-col: 68px;
  --schedule-row-height: 56px;
  --schedule-gap: 2px;
}

/* — Typography Utility Classes — */
.text-xs { font-size: var(--font-size-xs); line-height: var(--line-height-tight); }
.text-sm { font-size: var(--font-size-sm); line-height: var(--line-height-normal); }
.text-base { font-size: var(--font-size-base); line-height: var(--line-height-normal); }
.text-lg { font-size: var(--font-size-lg); line-height: var(--line-height-normal); }
.text-xl { font-size: var(--font-size-xl); line-height: var(--line-height-tight); }
.text-2xl { font-size: var(--font-size-2xl); line-height: var(--line-height-tight); }
.text-3xl { font-size: var(--font-size-3xl); line-height: var(--line-height-tight); }

.font-medium { font-weight: var(--font-weight-medium); }
.font-semibold { font-weight: var(--font-weight-semibold); }
.font-bold { font-weight: var(--font-weight-bold); }

.text-primary { color: var(--text-primary); }
.text-secondary { color: var(--text-secondary); }
.text-tertiary { color: var(--text-tertiary); }
.text-brand { color: var(--text-brand); }

/* — Color Utility Classes — */
.bg-brand { background-color: var(--color-brand); }
.bg-brand-light { background-color: var(--color-brand-light); }
.bg-brand-subtle { background-color: var(--color-brand-subtle); }
.bg-page { background-color: var(--surface-page); }
.bg-card { background-color: var(--surface-card); }

/* — Radius Utility Classes — */
.rounded-sm { border-radius: var(--radius-sm); }
.rounded-md { border-radius: var(--radius-md); }
.rounded-lg { border-radius: var(--radius-lg); }
.rounded-xl { border-radius: var(--radius-xl); }
.rounded-full { border-radius: var(--radius-full); }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--text-primary);
    --color-secondary: var(--text-secondary);
  }
  @layer base {
    body { background: var(--text-background); color: var(--text-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body>

  <!-- Top Bar -->
  <div style="background: var(--surface-card); border-bottom: 1px solid var(--border-default); padding: 14px 16px; display: flex; align-items: center; justify-content: center; position: relative;">
    <a style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; cursor: pointer; text-decoration: none;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--text-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <span style="font-size: var(--font-size-lg); font-weight: var(--font-weight-semibold); color: var(--text-primary);">导入课表</span>
  </div>

  <!-- Main Content -->
  <div style="padding: var(--space-2xl) var(--space-lg);">

    <!-- Upload Area -->
    <div style="border: 2px dashed var(--border-default); background: var(--surface-page); border-radius: var(--radius-xl); min-height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: var(--space-2xl); cursor: pointer; transition: background-color 0.15s ease;" onmouseover="this.style.background='#EEF0F5'" onmouseout="this.style.background='var(--surface-page)'">
      <!-- PDF Icon -->
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none" stroke="var(--color-brand)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 6h12l8 8v28a2 2 0 0 1-2 2H14a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/>
        <polyline points="26 6 26 14 34 14"/>
        <line x1="18" y1="24" x2="30" y2="24"/>
        <line x1="18" y1="30" x2="30" y2="30"/>
        <line x1="18" y1="36" x2="26" y2="36"/>
      </svg>
      <span style="margin-top: var(--space-lg); font-size: 16px; font-weight: var(--font-weight-semibold); color: var(--text-primary);">选择 PDF 课表文件</span>
      <span style="margin-top: 6px; font-size: var(--font-size-sm); color: var(--text-secondary);">支持文字型教务系统 PDF 课表</span>
    </div>

    <!-- Support Note -->
    <div style="padding: var(--space-md) var(--space-xs); display: flex; align-items: flex-start; gap: var(--space-sm);">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="flex-shrink: 0; margin-top: 1px;">
        <path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1z" fill="var(--text-tertiary)" opacity="0.15"/>
        <path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1z" stroke="var(--text-tertiary)" stroke-width="1.2"/>
        <path d="M8 7v4" stroke="var(--text-tertiary)" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="8" cy="5" r="0.75" fill="var(--text-tertiary)"/>
      </svg>
      <span style="font-size: var(--font-size-sm); color: var(--text-tertiary); line-height: var(--line-height-normal);">目前仅支持文字型 PDF。扫描版 PDF 暂不支持。</span>
    </div>

    <!-- Recent Imports Section -->
    <div style="margin-top: var(--space-2xl);">
      <span style="font-size: 15px; font-weight: var(--font-weight-semibold); color: var(--text-primary); display: block; margin-bottom: var(--space-md);">最近导入</span>

      <div style="display: flex; flex-direction: column; gap: var(--space-sm);">
        <!-- Card 1 -->
        <div style="background: var(--surface-card); border: 1px solid var(--border-default); border-radius: var(--radius-lg); padding: 14px 16px; display: flex; align-items: center; justify-content: space-between;">
          <div style="flex: 1; min-width: 0;">
            <div style="font-size: 14px; font-weight: var(--font-weight-normal); color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">苏国强(2025-2026-2)课表.pdf</div>
            <div style="font-size: var(--font-size-sm); color: var(--text-secondary); margin-top: 4px;">2026年7月10日导入 · 识别12门课</div>
          </div>
          <span style="flex-shrink: 0; margin-left: var(--space-md); background: var(--state-success-bg); color: var(--state-success); font-size: var(--font-size-xs); font-weight: var(--font-weight-medium); border-radius: var(--radius-full); padding: 3px 10px; white-space: nowrap;">已导入</span>
        </div>

        <!-- Card 2 -->
        <div style="background: var(--surface-card); border: 1px solid var(--border-default); border-radius: var(--radius-lg); padding: 14px 16px; display: flex; align-items: center; justify-content: space-between;">
          <div style="flex: 1; min-width: 0;">
            <div style="font-size: 14px; font-weight: var(--font-weight-normal); color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">2025-2026-1课表.pdf</div>
            <div style="font-size: var(--font-size-sm); color: var(--text-secondary); margin-top: 4px;">2026年2月15日导入 · 识别10门课</div>
          </div>
          <span style="flex-shrink: 0; margin-left: var(--space-md); background: var(--state-success-bg); color: var(--state-success); font-size: var(--font-size-xs); font-weight: var(--font-weight-medium); border-radius: var(--radius-full); padding: 3px 10px; white-space: nowrap;">已导入</span>
        </div>
      </div>
    </div>

    <!-- Simulated Parsing Progress -->
    <div style="margin-top: var(--space-2xl); background: var(--surface-card); border: 1px solid var(--border-default); border-radius: var(--radius-xl); padding: var(--space-2xl);">
      <div style="font-size: 14px; font-weight: var(--font-weight-semibold); color: var(--text-primary); margin-bottom: var(--space-lg);">正在解析...</div>

      <!-- Step 1: Complete -->
      <div style="display: flex; align-items: center; gap: var(--space-md); padding: 6px 0;">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <circle cx="10" cy="10" r="9" fill="var(--state-success)" opacity="0.12"/>
          <circle cx="10" cy="10" r="9" stroke="var(--state-success)" stroke-width="1.2"/>
          <polyline points="6 10 9 13 14 7" stroke="var(--state-success)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span style="font-size: var(--font-size-sm); color: var(--text-secondary);">读取文件</span>
      </div>

      <!-- Step 2: Complete -->
      <div style="display: flex; align-items: center; gap: var(--space-md); padding: 6px 0;">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <circle cx="10" cy="10" r="9" fill="var(--state-success)" opacity="0.12"/>
          <circle cx="10" cy="10" r="9" stroke="var(--state-success)" stroke-width="1.2"/>
          <polyline points="6 10 9 13 14 7" stroke="var(--state-success)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span style="font-size: var(--font-size-sm); color: var(--text-secondary);">提取文字</span>
      </div>

      <!-- Step 3: In Progress -->
      <div style="display: flex; align-items: center; gap: var(--space-md); padding: 6px 0;">
        <svg class="spin" width="20" height="20" viewBox="0 0 20 20" fill="none">
          <circle cx="10" cy="10" r="9" stroke="var(--color-brand)" stroke-width="1.8" stroke-dasharray="14 43" stroke-linecap="round"/>
        </svg>
        <span style="font-size: var(--font-size-sm); color: var(--text-primary); font-weight: var(--font-weight-medium);">识别表格</span>
      </div>

      <!-- Step 4: Pending -->
      <div style="display: flex; align-items: center; gap: var(--space-md); padding: 6px 0;">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <circle cx="10" cy="10" r="9" stroke="var(--text-tertiary)" stroke-width="1.2" opacity="0.4"/>
        </svg>
        <span style="font-size: var(--font-size-sm); color: var(--text-tertiary);">生成课程</span>
      </div>

      <!-- Disabled Button -->
      <div data-dom-id="btn-start-parse" style="margin-top: var(--space-xl);">
        <button disabled style="width: 100%; height: 44px; border-radius: var(--radius-lg); border: none; background: var(--color-brand); color: var(--text-inverse); font-size: var(--font-size-base); font-weight: var(--font-weight-semibold); font-family: var(--font-family); opacity: 0.5; cursor: not-allowed;">开始解析</button>
      </div>
    </div>

  </div>

  <!-- Bottom Nav (no tab active - sub-page) -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t z-50" style="border-color: var(--border-default); padding-bottom: env(safe-area-inset-bottom, 0); max-width: 375px; margin: 0 auto;">
    <div class="flex items-center justify-around" style="height: var(--nav-height);">
      <a class="flex flex-col items-center gap-0.5 flex-1 py-1.5 text-xs font-medium transition-colors" style="color: var(--text-tertiary);" data-nav-key="today" data-active="false">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>课表</span>
      </a>
      <a class="flex flex-col items-center gap-0.5 flex-1 py-1.5 text-xs font-medium transition-colors" style="color: var(--text-tertiary);" data-nav-key="schedule" data-active="false">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span>学习</span>
      </a>
      <a class="flex flex-col items-center gap-0.5 flex-1 py-1.5 text-xs font-medium transition-colors" style="color: var(--text-tertiary);" data-nav-key="settings" data-active="false">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>我的</span>
      </a>
    </div>
  </nav>


    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-family);
      font-size: var(--font-size-base);
      color: var(--text-primary);
      background: var(--surface-page);
      min-height: 100vh;
      max-width: 375px;
      margin: 0 auto;
      padding-bottom: calc(var(--nav-height) + 16px);
      -webkit-font-smoothing: antialiased;
    }

    /* Spinner animation */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .spin {
      animation: spin 0.8s linear infinite;
    }
  </style>
</body>
</html>
