<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今日概览 - Polaris课程表</title>
    <style id="theme-vars">
/* ============================================
   Polaris 课程表 — Brand Design Tokens
   ============================================ */

:root {
  /* — Primary Brand — */
  --color-brand: #2563EB;
  --color-brand-hover: #1D4ED8;
  --color-brand-light: #DBEAFE;
  --color-brand-subtle: #EFF6FF;

  /* — Semantic State Colors — */
  --state-success: #059669;
  --state-success-bg: #ECFDF5;
  --state-warning: #D97706;
  --state-warning-bg: #FFFBEB;
  --state-error: #DC2626;
  --state-error-bg: #FEF2F2;
  --state-info: #2563EB;
  --state-info-bg: #EFF6FF;

  /* — Course Palette (by weekday) — */
  --course-mon: #2563EB;
  --course-mon-bg: #EAF2FF;
  --course-tue: #E8645A;
  --course-tue-bg: #FFEDEE;
  --course-wed: #0D9488;
  --course-wed-bg: #EAF8F1;
  --course-thu: #7C3AED;
  --course-thu-bg: #F1EAFE;
  --course-fri: #D97706;
  --course-fri-bg: #FFF3D9;
  --course-sat: #EC4899;
  --course-sat-bg: #FDF2F8;

  /* — Surfaces — */
  --surface-page: #F6F7FB;
  --surface-card: #FFFFFF;
  --surface-elevated: #FFFFFF;
  --surface-overlay: rgba(15, 23, 42, 0.5);

  /* — Text — */
  --text-primary: #172033;
  --text-secondary: #667085;
  --text-tertiary: #98A2B3;
  --text-inverse: #FFFFFF;
  --text-brand: #2563EB;

  /* — Borders — */
  --border-default: #D9DFEA;
  --border-subtle: #E5E7EB;
  --border-brand: #2563EB;

  /* — Typography — */
  --font-family: 'Inter', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
  --font-size-xs: 11px;
  --font-size-sm: 13px;
  --font-size-base: 15px;
  --font-size-lg: 17px;
  --font-size-xl: 20px;
  --font-size-2xl: 24px;
  --font-size-3xl: 28px;
  --line-height-tight: 1.25;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.625;
  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  /* — Radius — */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* — Spacing — */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;
  --space-4xl: 40px;

  /* — Shadow — */
  --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.03);
  --shadow-elevated: 0 4px 12px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.04);
  --shadow-float: 0 10px 25px rgba(0, 0, 0, 0.08), 0 4px 10px rgba(0, 0, 0, 0.04);

  /* — Bottom Nav Height — */
  --nav-height: 64px;
  --status-bar-height: 44px;

  /* — Schedule Grid — */
  --schedule-time-col: 48px;
  --schedule-day-col: 68px;
  --schedule-row-height: 56px;
  --schedule-gap: 2px;
}

/* — Typography Utility Classes — */
.text-xs { font-size: var(--font-size-xs); line-height: var(--line-height-tight); }
.text-sm { font-size: var(--font-size-sm); line-height: var(--line-height-normal); }
.text-base { font-size: var(--font-size-base); line-height: var(--line-height-normal); }
.text-lg { font-size: var(--font-size-lg); line-height: var(--line-height-normal); }
.text-xl { font-size: var(--font-size-xl); line-height: var(--line-height-tight); }
.text-2xl { font-size: var(--font-size-2xl); line-height: var(--line-height-tight); }
.text-3xl { font-size: var(--font-size-3xl); line-height: var(--line-height-tight); }

.font-medium { font-weight: var(--font-weight-medium); }
.font-semibold { font-weight: var(--font-weight-semibold); }
.font-bold { font-weight: var(--font-weight-bold); }

.text-primary { color: var(--text-primary); }
.text-secondary { color: var(--text-secondary); }
.text-tertiary { color: var(--text-tertiary); }
.text-brand { color: var(--text-brand); }

/* — Color Utility Classes — */
.bg-brand { background-color: var(--color-brand); }
.bg-brand-light { background-color: var(--color-brand-light); }
.bg-brand-subtle { background-color: var(--color-brand-subtle); }
.bg-page { background-color: var(--surface-page); }
.bg-card { background-color: var(--surface-card); }

/* — Radius Utility Classes — */
.rounded-sm { border-radius: var(--radius-sm); }
.rounded-md { border-radius: var(--radius-md); }
.rounded-lg { border-radius: var(--radius-lg); }
.rounded-xl { border-radius: var(--radius-xl); }
.rounded-full { border-radius: var(--radius-full); }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--text-primary);
    --color-secondary: var(--text-secondary);
  }
  @layer base {
    body { background: var(--text-background); color: var(--text-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body style="margin: 0; padding: 0; background: var(--surface-page); font-family: var(--font-family); -webkit-font-smoothing: antialiased;">

  <!-- Mobile viewport container -->
  <div style="max-width: 375px; margin: 0 auto; min-height: 100vh; background: var(--surface-page); position: relative; padding-bottom: calc(var(--nav-height) + 16px);">

    <!-- 1. Status Bar Area (44px) -->
    <div style="height: var(--status-bar-height); display: flex; align-items: center; justify-content: space-between; padding: 0 var(--space-lg); background: var(--surface-card);">
      <span style="font-size: var(--font-size-lg); font-weight: var(--font-weight-bold); color: var(--text-primary); letter-spacing: -0.3px;">Polaris</span>
      <div style="display: flex; align-items: center; gap: var(--space-lg);">
        <!-- + Import button -->
        <button style="background: none; border: none; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; color: var(--text-secondary);">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
        <!-- Share icon -->
        <button style="background: none; border: none; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; color: var(--text-secondary);">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18" cy="5" r="3"></circle>
            <circle cx="6" cy="12" r="3"></circle>
            <circle cx="18" cy="19" r="3"></circle>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- 2. Week Badge + Date Row -->
    <div style="display: flex; align-items: center; justify-content: space-between; padding: var(--space-md) var(--space-lg);">
      <span style="background: var(--color-brand-light); color: var(--color-brand); font-size: var(--font-size-xs); font-weight: var(--font-weight-semibold); padding: 2px 10px; border-radius: var(--radius-full); line-height: 1.6;">第18周</span>
      <span style="color: var(--text-secondary); font-size: var(--font-size-sm);">2026年7月13日 周一</span>
    </div>

    <!-- 3. Stats Row -->
    <div style="display: flex; gap: var(--space-sm); padding: 0 var(--space-lg); margin-bottom: var(--space-lg);">
      <!-- Card 1: 本周课程 -->
      <div style="flex: 1; background: var(--surface-card); border: 1px solid var(--border-default); border-radius: var(--radius-lg); padding: var(--space-md) 0; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <span style="font-size: var(--font-size-xl); font-weight: var(--font-weight-bold); color: var(--text-primary); line-height: 1.2;">4</span>
        <span style="font-size: var(--font-size-xs); color: var(--text-secondary); margin-top: 2px;">本周课程</span>
      </div>
      <!-- Card 2: 实验/实践 -->
      <div style="flex: 1; background: var(--surface-card); border: 1px solid var(--border-default); border-radius: var(--radius-lg); padding: var(--space-md) 0; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <span style="font-size: var(--font-size-xl); font-weight: var(--font-weight-bold); color: var(--text-primary); line-height: 1.2;">1</span>
        <span style="font-size: var(--font-size-xs); color: var(--text-secondary); margin-top: 2px;">实验/实践</span>
      </div>
      <!-- Card 3: 当前周次 -->
      <div style="flex: 1; background: var(--surface-card); border: 1px solid var(--border-default); border-radius: var(--radius-lg); padding: var(--space-md) 0; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <span style="font-size: var(--font-size-xl); font-weight: var(--font-weight-bold); color: var(--text-primary); line-height: 1.2;">18</span>
        <span style="font-size: var(--font-size-xs); color: var(--text-secondary); margin-top: 2px;">当前周次</span>
      </div>
    </div>

    <!-- 4. Section Header -->
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 var(--space-lg); margin-bottom: var(--space-md);">
      <span style="font-size: var(--font-size-lg); font-weight: var(--font-weight-semibold); color: var(--text-primary);">今日课程</span>
      <a data-dom-id="nav-schedule" style="font-size: var(--font-size-sm); color: var(--text-brand); text-decoration: none; cursor: pointer; display: flex; align-items: center; gap: 2px;">
        查看周课表
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </a>
    </div>

    <!-- 5. Today's Course List -->
    <div style="display: flex; flex-direction: column; gap: var(--space-sm); padding: 0 var(--space-lg);">

      <!-- Course 1: 高等数学 -->
      <div style="background: var(--surface-card); border: 1px solid var(--border-default); border-left: 4px solid var(--course-mon); border-radius: var(--radius-lg); padding: 14px var(--space-lg);">
        <div style="font-size: var(--font-size-base); font-weight: var(--font-weight-semibold); color: var(--text-primary); margin-bottom: 6px;">高等数学</div>
        <div style="font-size: var(--font-size-xs); color: var(--text-secondary); margin-bottom: 4px;">周一 1-2节 08:00-09:35</div>
        <div style="display: flex; align-items: center; gap: 4px; font-size: var(--font-size-xs); color: var(--text-secondary);">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
          教A-301
        </div>
      </div>

      <!-- Course 2: 大学物理实验 -->
      <div style="background: var(--surface-card); border: 1px solid var(--border-default); border-left: 4px solid var(--course-tue); border-radius: var(--radius-lg); padding: 14px var(--space-lg);">
        <div style="font-size: var(--font-size-base); font-weight: var(--font-weight-semibold); color: var(--text-primary); margin-bottom: 6px;">大学物理实验</div>
        <div style="font-size: var(--font-size-xs); color: var(--text-secondary); margin-bottom: 4px;">周一 3-4节 10:05-11:40</div>
        <div style="display: flex; align-items: center; gap: 4px; font-size: var(--font-size-xs); color: var(--text-secondary);">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
          实验楼B-205
        </div>
      </div>

      <!-- Course 3: 线性代数 -->
      <div style="background: var(--surface-card); border: 1px solid var(--border-default); border-left: 4px solid var(--course-wed); border-radius: var(--radius-lg); padding: 14px var(--space-lg);">
        <div style="font-size: var(--font-size-base); font-weight: var(--font-weight-semibold); color: var(--text-primary); margin-bottom: 6px;">线性代数</div>
        <div style="font-size: var(--font-size-xs); color: var(--text-secondary); margin-bottom: 4px;">周一 7-8节 14:00-15:35</div>
        <div style="display: flex; align-items: center; gap: 4px; font-size: var(--font-size-xs); color: var(--text-secondary);">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
          教C-102
        </div>
      </div>

    </div>

    <!-- 6. Bottom Navigation -->
    <nav style="position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); max-width: 375px; width: 100%; background: var(--surface-card); border-top: 1px solid var(--border-default); z-index: 50; padding-bottom: env(safe-area-inset-bottom, 0);">
      <div style="display: flex; align-items: center; justify-content: space-around; height: var(--nav-height);">
        <!-- 课表 (Active) -->
        <a data-nav-key="today" data-active="true" data-dom-id="nav-today-hidden" style="display: flex; flex-direction: column; align-items: center; gap: 2px; flex: 1; padding: 6px 0 0; font-size: var(--font-size-xs); font-weight: 600; color: var(--color-brand); text-decoration: none; transition: color 0.15s;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span>课表</span>
        </a>
        <!-- 学习 -->
        <a data-nav-key="schedule" data-active="false" style="display: flex; flex-direction: column; align-items: center; gap: 2px; flex: 1; padding: 6px 0 0; font-size: var(--font-size-xs); font-weight: 500; color: var(--text-tertiary); text-decoration: none; transition: color 0.15s;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          <span>学习</span>
        </a>
        <!-- 我的 -->
        <a data-nav-key="settings" data-active="false" data-dom-id="nav-settings" style="display: flex; flex-direction: column; align-items: center; gap: 2px; flex: 1; padding: 6px 0 0; font-size: var(--font-size-xs); font-weight: 500; color: var(--text-tertiary); text-decoration: none; transition: color 0.15s;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>我的</span>
        </a>
      </div>
    </nav>

  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
