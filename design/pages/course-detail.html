<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课程详情 — Polaris课程表</title>
    <style id="theme-vars">
/* ============================================
   Polaris 课程表 — Brand Design Tokens
   ============================================ */

:root {
  /* — Primary Brand — */
  --color-brand: #2563EB;
  --color-brand-hover: #1D4ED8;
  --color-brand-light: #DBEAFE;
  --color-brand-subtle: #EFF6FF;

  /* — Semantic State Colors — */
  --state-success: #059669;
  --state-success-bg: #ECFDF5;
  --state-warning: #D97706;
  --state-warning-bg: #FFFBEB;
  --state-error: #DC2626;
  --state-error-bg: #FEF2F2;
  --state-info: #2563EB;
  --state-info-bg: #EFF6FF;

  /* — Course Palette (by weekday) — */
  --course-mon: #2563EB;
  --course-mon-bg: #EAF2FF;
  --course-tue: #E8645A;
  --course-tue-bg: #FFEDEE;
  --course-wed: #0D9488;
  --course-wed-bg: #EAF8F1;
  --course-thu: #7C3AED;
  --course-thu-bg: #F1EAFE;
  --course-fri: #D97706;
  --course-fri-bg: #FFF3D9;
  --course-sat: #EC4899;
  --course-sat-bg: #FDF2F8;

  /* — Surfaces — */
  --surface-page: #F6F7FB;
  --surface-card: #FFFFFF;
  --surface-elevated: #FFFFFF;
  --surface-overlay: rgba(15, 23, 42, 0.5);

  /* — Text — */
  --text-primary: #172033;
  --text-secondary: #667085;
  --text-tertiary: #98A2B3;
  --text-inverse: #FFFFFF;
  --text-brand: #2563EB;

  /* — Borders — */
  --border-default: #D9DFEA;
  --border-subtle: #E5E7EB;
  --border-brand: #2563EB;

  /* — Typography — */
  --font-family: 'Inter', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
  --font-size-xs: 11px;
  --font-size-sm: 13px;
  --font-size-base: 15px;
  --font-size-lg: 17px;
  --font-size-xl: 20px;
  --font-size-2xl: 24px;
  --font-size-3xl: 28px;
  --line-height-tight: 1.25;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.625;
  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  /* — Radius — */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* — Spacing — */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;
  --space-4xl: 40px;

  /* — Shadow — */
  --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.03);
  --shadow-elevated: 0 4px 12px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.04);
  --shadow-float: 0 10px 25px rgba(0, 0, 0, 0.08), 0 4px 10px rgba(0, 0, 0, 0.04);

  /* — Bottom Nav Height — */
  --nav-height: 64px;
  --status-bar-height: 44px;

  /* — Schedule Grid — */
  --schedule-time-col: 48px;
  --schedule-day-col: 68px;
  --schedule-row-height: 56px;
  --schedule-gap: 2px;
}

/* — Typography Utility Classes — */
.text-xs { font-size: var(--font-size-xs); line-height: var(--line-height-tight); }
.text-sm { font-size: var(--font-size-sm); line-height: var(--line-height-normal); }
.text-base { font-size: var(--font-size-base); line-height: var(--line-height-normal); }
.text-lg { font-size: var(--font-size-lg); line-height: var(--line-height-normal); }
.text-xl { font-size: var(--font-size-xl); line-height: var(--line-height-tight); }
.text-2xl { font-size: var(--font-size-2xl); line-height: var(--line-height-tight); }
.text-3xl { font-size: var(--font-size-3xl); line-height: var(--line-height-tight); }

.font-medium { font-weight: var(--font-weight-medium); }
.font-semibold { font-weight: var(--font-weight-semibold); }
.font-bold { font-weight: var(--font-weight-bold); }

.text-primary { color: var(--text-primary); }
.text-secondary { color: var(--text-secondary); }
.text-tertiary { color: var(--text-tertiary); }
.text-brand { color: var(--text-brand); }

/* — Color Utility Classes — */
.bg-brand { background-color: var(--color-brand); }
.bg-brand-light { background-color: var(--color-brand-light); }
.bg-brand-subtle { background-color: var(--color-brand-subtle); }
.bg-page { background-color: var(--surface-page); }
.bg-card { background-color: var(--surface-card); }

/* — Radius Utility Classes — */
.rounded-sm { border-radius: var(--radius-sm); }
.rounded-md { border-radius: var(--radius-md); }
.rounded-lg { border-radius: var(--radius-lg); }
.rounded-xl { border-radius: var(--radius-xl); }
.rounded-full { border-radius: var(--radius-full); }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--text-primary);
    --color-secondary: var(--text-secondary);
  }
  @layer base {
    body { background: var(--text-background); color: var(--text-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body>
  <div class="mobile-frame">
    <!-- Dimmed backdrop -->
    <div class="detail-backdrop" data-dom-id="detail-backdrop"></div>

    <!-- Bottom sheet -->
    <div class="bottom-sheet">
      <div class="sheet-scroll">
        <!-- Drag handle -->
        <div class="drag-handle"></div>

        <!-- Course color strip -->
        <div class="course-color-strip"></div>

        <!-- Course name -->
        <div class="course-name">高等数学</div>

        <!-- Info grid -->
        <div class="info-grid">
          <div class="info-row">
            <span class="info-label">上课时间</span>
            <span class="info-value">周一 1-2节</span>
          </div>
          <div class="info-row">
            <span class="info-label">具体时间</span>
            <span class="info-value">08:00 - 09:35</span>
          </div>
          <div class="info-row">
            <span class="info-label">上课地点</span>
            <span class="info-value">
              <svg class="location-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                <circle cx="12" cy="10" r="3"/>
              </svg>
              教A-301
            </span>
          </div>
          <div class="info-row">
            <span class="info-label">授课教师</span>
            <span class="info-value">张明华 教授</span>
          </div>
          <div class="info-row">
            <span class="info-label">课程类型</span>
            <span class="info-value">讲课</span>
          </div>
          <div class="info-row">
            <span class="info-label">周次范围</span>
            <span class="info-value">第1-16周 (每周)</span>
          </div>
          <div class="info-row">
            <span class="info-label">学分</span>
            <span class="info-value">4.0</span>
          </div>
          <div class="info-row">
            <span class="info-label">教学班</span>
            <span class="info-value">计算机2301-2304</span>
          </div>
        </div>

        <!-- Confidence indicator -->
        <div class="confidence-bar">
          <svg class="info-circle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="16" x2="12" y2="12"/>
            <line x1="12" y1="8" x2="12.01" y2="8"/>
          </svg>
          <span class="confidence-text">解析置信度：高 — 所有字段均已识别</span>
        </div>

        <!-- Raw source toggle -->
        <div class="source-toggle">
          <span class="source-toggle-label">查看原始文本</span>
          <svg class="chevron-icon expanded" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </div>
        <div class="source-content">
          高等数学(1-2节) 场地:教A-301 教师:张明华
        </div>
      </div>

      <!-- Action buttons -->
      <div class="action-buttons">
        <button class="btn btn-secondary" data-dom-id="detail-close">关闭</button>
        <button class="btn btn-primary">添加提醒</button>
      </div>
    </div>
  </div>

    <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-family);
      background: var(--surface-page);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    .mobile-frame {
      width: 375px;
      min-height: 100vh;
      position: relative;
      background: var(--surface-page);
      overflow: hidden;
    }

    /* Dimmed backdrop */
    .detail-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.4);
      z-index: 100;
    }

    /* Bottom sheet */
    .bottom-sheet {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 375px;
      background: var(--surface-card);
      border-radius: 20px 20px 0 0;
      box-shadow: var(--shadow-float);
      max-height: 70vh;
      z-index: 101;
      display: flex;
      flex-direction: column;
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideUp {
      from {
        transform: translateX(-50%) translateY(100%);
      }
      to {
        transform: translateX(-50%) translateY(0);
      }
    }

    .sheet-scroll {
      overflow-y: auto;
      flex: 1;
    }

    /* Drag handle */
    .drag-handle {
      width: 36px;
      height: 4px;
      background: var(--border-default);
      border-radius: var(--radius-full);
      margin: 10px auto 0;
      flex-shrink: 0;
    }

    /* Course color strip */
    .course-color-strip {
      height: 4px;
      background: var(--course-mon);
      flex-shrink: 0;
    }

    /* Course name */
    .course-name {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.25;
      padding: var(--space-lg) var(--space-xl) 0;
    }

    /* Info grid */
    .info-grid {
      padding: var(--space-lg) var(--space-xl) 0;
    }

    .info-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 8px 0;
    }

    .info-label {
      font-size: 13px;
      color: var(--text-secondary);
      flex-shrink: 0;
      line-height: 1.5;
    }

    .info-value {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-primary);
      text-align: right;
      line-height: 1.5;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .location-pin {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      color: var(--text-tertiary);
    }

    /* Confidence indicator */
    .confidence-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--color-brand-subtle);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      margin: var(--space-lg) var(--space-xl);
    }

    .info-circle-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      color: var(--color-brand);
    }

    .confidence-text {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* Raw source toggle */
    .source-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-xl);
      cursor: pointer;
      user-select: none;
    }

    .source-toggle-label {
      font-size: 13px;
      color: var(--text-brand);
      font-weight: 500;
    }

    .chevron-icon {
      width: 16px;
      height: 16px;
      color: var(--text-brand);
      transition: transform 0.2s ease;
    }

    .chevron-icon.expanded {
      transform: rotate(180deg);
    }

    .source-content {
      margin: 8px var(--space-xl) 0;
      background: var(--surface-page);
      border-radius: var(--radius-sm);
      padding: var(--space-md);
      font-size: 12px;
      color: var(--text-secondary);
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      line-height: 1.6;
    }

    /* Action buttons */
    .action-buttons {
      display: flex;
      gap: 12px;
      padding: var(--space-lg) var(--space-xl) 24px;
      flex-shrink: 0;
    }

    .btn {
      flex: 1;
      height: 44px;
      border-radius: var(--radius-lg);
      font-size: 15px;
      font-weight: 500;
      font-family: var(--font-family);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      outline: none;
      transition: background 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-secondary {
      background: var(--surface-card);
      border: 1px solid var(--border-default);
      color: var(--text-primary);
    }

    .btn-secondary:active {
      background: var(--surface-page);
    }

    .btn-primary {
      background: var(--color-brand);
      color: var(--text-inverse);
    }

    .btn-primary:active {
      background: var(--color-brand-hover);
    }
  </style>
</body>
</html>
