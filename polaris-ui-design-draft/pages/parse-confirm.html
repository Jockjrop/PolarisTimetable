<!DOCTYPE html>

<head>

    <style id="theme-vars">
/* ============================================
   Polaris 课程表 — Brand Design Tokens
   ============================================ */

:root {
  /* — Primary Brand — */
  --color-brand: #2563EB;
  --color-brand-hover: #1D4ED8;
  --color-brand-light: #DBEAFE;
  --color-brand-subtle: #EFF6FF;

  /* — Semantic State Colors — */
  --state-success: #059669;
  --state-success-bg: #ECFDF5;
  --state-warning: #D97706;
  --state-warning-bg: #FFFBEB;
  --state-error: #DC2626;
  --state-error-bg: #FEF2F2;
  --state-info: #2563EB;
  --state-info-bg: #EFF6FF;

  /* — Course Palette (by weekday) — */
  --course-mon: #2563EB;
  --course-mon-bg: #EAF2FF;
  --course-tue: #E8645A;
  --course-tue-bg: #FFEDEE;
  --course-wed: #0D9488;
  --course-wed-bg: #EAF8F1;
  --course-thu: #7C3AED;
  --course-thu-bg: #F1EAFE;
  --course-fri: #D97706;
  --course-fri-bg: #FFF3D9;
  --course-sat: #EC4899;
  --course-sat-bg: #FDF2F8;

  /* — Surfaces — */
  --surface-page: #F6F7FB;
  --surface-card: #FFFFFF;
  --surface-elevated: #FFFFFF;
  --surface-overlay: rgba(15, 23, 42, 0.5);

  /* — Semantic Aliases (for fill-html-head.mjs) — */
  --text-background: #F6F7FB;
  --text-foreground: #172033;
  --text-card: #FFFFFF;
  --text-border: #D9DFEA;
  --text-muted: #98A2B3;
  --text-primary: #172033;
  --text-secondary: #667085;
  --text-tertiary: #98A2B3;
  --text-inverse: #FFFFFF;
  --text-brand: #2563EB;

  /* — Borders — */
  --border-default: #D9DFEA;
  --border-subtle: #E5E7EB;
  --border-brand: #2563EB;

  /* — Typography — */
  --font-family: 'Inter', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
  --font-size-xs: 11px;
  --font-size-sm: 13px;
  --font-size-base: 15px;
  --font-size-lg: 17px;
  --font-size-xl: 20px;
  --font-size-2xl: 24px;
  --font-size-3xl: 28px;
  --line-height-tight: 1.25;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.625;
  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  /* — Radius — */
  --radius-sm: 6px;
  --radius-small: 6px;
  --text-radius-sm: 6px;
  --radius-md: 10px;
  --radius-medium: 10px;
  --text-radius-md: 10px;
  --radius-lg: 14px;
  --radius-large: 14px;
  --text-radius-lg: 14px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* — Spacing — */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;
  --space-4xl: 40px;

  /* — Shadow — */
  --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.03);
  --shadow-elevated: 0 4px 12px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.04);
  --shadow-float: 0 10px 25px rgba(0, 0, 0, 0.08), 0 4px 10px rgba(0, 0, 0, 0.04);

  /* — Bottom Nav Height — */
  --nav-height: 64px;
  --status-bar-height: 44px;

  /* — Schedule Grid — */
  --schedule-time-col: 48px;
  --schedule-day-col: 68px;
  --schedule-row-height: 56px;
  --schedule-gap: 2px;
}

/* — Typography Utility Classes — */
.text-xs { font-size: var(--font-size-xs); line-height: var(--line-height-tight); }
.text-sm { font-size: var(--font-size-sm); line-height: var(--line-height-normal); }
.text-base { font-size: var(--font-size-base); line-height: var(--line-height-normal); }
.text-lg { font-size: var(--font-size-lg); line-height: var(--line-height-normal); }
.text-xl { font-size: var(--font-size-xl); line-height: var(--line-height-tight); }
.text-2xl { font-size: var(--font-size-2xl); line-height: var(--line-height-tight); }
.text-3xl { font-size: var(--font-size-3xl); line-height: var(--line-height-tight); }

.font-medium { font-weight: var(--font-weight-medium); }
.font-semibold { font-weight: var(--font-weight-semibold); }
.font-bold { font-weight: var(--font-weight-bold); }

.text-primary { color: var(--text-primary); }
.text-secondary { color: var(--text-secondary); }
.text-tertiary { color: var(--text-tertiary); }
.text-brand { color: var(--text-brand); }

/* — Color Utility Classes — */
.bg-brand { background-color: var(--color-brand); }
.bg-brand-light { background-color: var(--color-brand-light); }
.bg-brand-subtle { background-color: var(--color-brand-subtle); }
.bg-page { background-color: var(--surface-page); }
.bg-card { background-color: var(--surface-card); }

/* — Radius Utility Classes — */
.rounded-sm { border-radius: var(--radius-sm); }
.rounded-md { border-radius: var(--radius-md); }
.rounded-lg { border-radius: var(--radius-lg); }
.rounded-xl { border-radius: var(--radius-xl); }
.rounded-full { border-radius: var(--radius-full); }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>

    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--text-background);
    --color-foreground: var(--text-foreground);
    --color-card: var(--text-card);
    --color-primary: var(--text-primary);
    --color-secondary: var(--text-secondary);
    --color-muted: var(--text-muted);
    --color-border: var(--text-border);
    --radius-sm: var(--text-radius-sm);
    --radius-md: var(--text-radius-md);
    --radius-lg: var(--text-radius-lg);
  }
  @layer base {
    body { background: var(--text-background); color: var(--text-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--text-background); }
      .text-background { color: var(--text-background); }
      .border-background { border-color: var(--text-background); }
      .ring-background { --tw-ring-color: var(--text-background); }
      .bg-foreground { background-color: var(--text-foreground); }
      .text-foreground { color: var(--text-foreground); }
      .border-foreground { border-color: var(--text-foreground); }
      .ring-foreground { --tw-ring-color: var(--text-foreground); }
      .bg-card { background-color: var(--text-card); }
      .text-card { color: var(--text-card); }
      .border-card { border-color: var(--text-card); }
      .ring-card { --tw-ring-color: var(--text-card); }
      .bg-primary { background-color: var(--text-primary); }
      .text-primary { color: var(--text-primary); }
      .border-primary { border-color: var(--text-primary); }
      .ring-primary { --tw-ring-color: var(--text-primary); }
      .bg-secondary { background-color: var(--text-secondary); }
      .text-secondary { color: var(--text-secondary); }
      .border-secondary { border-color: var(--text-secondary); }
      .ring-secondary { --tw-ring-color: var(--text-secondary); }
      .bg-muted { background-color: var(--text-muted); }
      .text-muted { color: var(--text-muted); }
      .border-muted { border-color: var(--text-muted); }
      .ring-muted { --tw-ring-color: var(--text-muted); }
      .bg-border { background-color: var(--text-border); }
      .text-border { color: var(--text-border); }
      .border-border { border-color: var(--text-border); }
      .ring-border { --tw-ring-color: var(--text-border); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main>

      <!-- Top Bar — Frosted Glass -->
      <div class="top-bar">
        <button class="back-btn" data-dom-id="btn-back-import" aria-label="返回">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6"/>

        </button>

      </div>

      <!-- Summary Header — Gradient Card -->
      <div class="summary-section">
        <div class="summary-card">
          <div class="stats-row">
            <div class="stat-card">
              <span class="stat-number stat-brand">12</span>
              <span class="stat-label">识别课程</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-card">
              <span class="stat-number stat-warning">2</span>
              <span class="stat-label">低置信度</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-card">
              <span class="stat-number stat-success">0</span>
              <span class="stat-label">识别失败</span>
            </div>
          </div>
        </div>
        <div class="source-file-row">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
          </svg>
          <span class="source-file-name">苏国强(2025-2026-2)课表.pdf</span>

      <!-- Course List -->
      <div class="course-list">

        <!-- Monday -->

          <div class="day-label" style="--accent: var(--course-mon);">

            周一
          </div>
          <div class="course-cards">
            <div class="course-card">
              <span class="color-dot" style="background: var(--course-mon);"></span>
              <div class="card-body">
                <div class="course-name">高等数学</div>
                <div class="course-meta">1-2节 · 教A-301</div>
              </div>
            </div>
            <div class="course-card">
              <span class="color-dot" style="background: var(--course-tue);"></span>
              <div class="card-body">
                <div class="course-name">大学物理实验</div>
                <div class="course-meta">3-4节 · 实验楼B-205</div>
              </div>
            </div>
          </div>
        </div>

        <!-- Tuesday -->
        <div class="day-group">
          <div class="day-label" style="--accent: var(--course-tue);">
            <span class="day-label-accent"></span>
            周二
          </div>
          <div class="course-cards">
            <div class="course-card">
              <span class="color-dot" style="background: var(--course-wed);"></span>
              <div class="card-body">
                <div class="course-name">程序设计基础</div>
                <div class="course-meta">1-2节 · 教B-401</div>
              </div>
            </div>
            <div class="course-card low-confidence">
              <span class="color-dot" style="background: var(--course-thu);"></span>
              <div class="card-body">
                <div class="card-top-row">
                  <div class="course-name">数据结构(双语)</div>
                  <span class="low-confidence-badge">低置信度</span>
                </div>
                <div class="course-meta">5-6节 · 教A-502</div>

          </div>
        </div>

        <!-- Wednesday -->
        <div class="day-group">
          <div class="day-label" style="--accent: var(--course-wed);">
            <span class="day-label-accent"></span>
            周三
          </div>
          <div class="course-cards">
            <div class="course-card">
              <span class="color-dot" style="background: var(--course-wed);"></span>
              <div class="card-body">
                <div class="course-name">大学英语(三)</div>

        <div class="day-group">

          </div>
          <div class="course-cards">
            <div class="course-card">
              <span class="color-dot" style="background: var(--course-fri);"></span>
              <div class="card-body">
                <div class="course-name">线性代数</div>
                <div class="course-meta">1-2节 · 教C-102</div>

          <div class="course-cards">

              <span class="color-dot" style="background: var(--course-sat);"></span>

                <div class="course-name">体育(篮球)</div>

              </div>
            </div>
          </div>

      </div>

      <!-- Bottom spacer for fixed bar -->
      <div class="bottom-spacer"></div>

      <!-- Bottom Action Bar — Frosted Glass -->
      <div class="bottom-action-bar">
        <button class="btn-confirm" data-dom-id="btn-confirm-save">确认保存</button>
        <button class="btn-reimport">重新导入</button>
      </div>

    </main>

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: var(--font-family);
        background: var(--surface-page);
        color: var(--text-primary);
        max-width: 375px;
        margin: 0 auto;
        min-height: 100vh;
        position: relative;
        -webkit-font-smoothing: antialiased;
      }

      /* ========================================
         Top Bar — Frosted Glass
         ======================================== */
      .top-bar {
        position: sticky;
        top: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px var(--space-lg);
        background: rgba(255, 255, 255, 0.78);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(217, 223, 234, 0.5);
      }
      .top-bar .back-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        color: var(--text-primary);
        background: none;
        border: none;
        transition: background 0.15s ease;
      }
      .top-bar .back-btn:active {
        background: rgba(37, 99, 235, 0.08);
      }
      .top-bar-title {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        font-size: var(--font-size-lg);
        font-weight: var(--font-weight-semibold);
        color: var(--text-primary);
        white-space: nowrap;
      }
      .top-bar .log-btn {
        font-size: var(--font-size-sm);
        color: var(--text-brand);
        background: none;
        border: none;
        cursor: pointer;
        font-weight: var(--font-weight-medium);
        padding: 6px 0;
      }
      .top-bar .log-btn:active {
        opacity: 0.7;
      }

      /* ========================================
         Summary Section — Gradient Card + Shadow
         ======================================== */
      .summary-section {
        padding: var(--space-xl) var(--space-lg) 0;
      }
      .summary-card {
        background: linear-gradient(135deg, var(--color-brand) 0%, #3B7BF7 60%, #6C9FFF 100%);
        border-radius: var(--radius-lg);
        padding: var(--space-xl) var(--space-lg);
        box-shadow: 0 4px 16px rgba(37, 99, 235, 0.2), 0 1px 3px rgba(37, 99, 235, 0.1);
      }
      .stats-row {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .stat-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        flex: 1;
      }
      .stat-divider {
        width: 1px;
        height: 28px;
        background: rgba(255, 255, 255, 0.2);
        flex-shrink: 0;
      }
      .stat-number {
        font-size: 26px;
        font-weight: var(--font-weight-bold);
        line-height: var(--line-height-tight);
        color: var(--text-inverse);
      }
      .stat-label {
        font-size: var(--font-size-xs);
        color: rgba(255, 255, 255, 0.75);
        font-weight: var(--font-weight-medium);
        white-space: nowrap;
      }

      .source-file-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin-top: var(--space-lg);
      }
      .source-file-row svg {
        color: var(--text-tertiary);
        flex-shrink: 0;
      }
      .source-file-name {
        font-size: var(--font-size-sm);
        color: var(--text-tertiary);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 240px;
      }

      /* ========================================
         Course List
         ======================================== */
      .course-list {
        padding: var(--space-xl) var(--space-lg) 0;
      }
      .bottom-spacer {
        height: 110px;
      }

      /* Day Group */
      .day-group + .day-group {
        margin-top: var(--space-3xl);
      }
      .day-label {
        display: flex;
        align-items: center;
        gap: var(--space-sm);
        font-size: 14px;
        font-weight: var(--font-weight-semibold);
        color: var(--text-primary);
        padding-bottom: var(--space-md);
        letter-spacing: 0.3px;
      }
      .day-label-accent {
        display: block;
        width: 3px;
        height: 16px;
        border-radius: 2px;
        background: var(--accent);
        flex-shrink: 0;
      }
      .course-cards {
        display: flex;
        flex-direction: column;
        gap: var(--space-sm);
      }

      /* ========================================
         Course Card — Shadow + Color Dot
         ======================================== */
      .course-card {
        display: flex;
        align-items: flex-start;
        gap: var(--space-md);
        background: var(--surface-card);
        border-radius: var(--radius-md);
        padding: 14px var(--space-lg);
        box-shadow: var(--shadow-card);
        position: relative;
        transition: box-shadow 0.2s ease;
      }
      .course-card:active {
        box-shadow: var(--shadow-elevated);
      }
      .color-dot {
        display: block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-top: 5px;
        flex-shrink: 0;
      }
      .card-body {
        flex: 1;
        min-width: 0;
      }
      .course-name {
        font-size: var(--font-size-base);
        font-weight: var(--font-weight-semibold);
        color: var(--text-primary);
        line-height: 1.35;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .course-meta {
        font-size: var(--font-size-sm);
        color: var(--text-secondary);
        margin-top: var(--space-xs);
        line-height: var(--line-height-normal);
      }

      /* Low confidence card */
      .course-card.low-confidence {
        background: var(--state-warning-bg);
        box-shadow: none;
        border: 1px solid rgba(217, 119, 6, 0.15);
      }
      .course-card.low-confidence .course-name {
        text-decoration: underline;
        text-decoration-style: dashed;
        text-decoration-color: var(--state-warning);
        text-underline-offset: 3px;
      }
      .card-top-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: var(--space-sm);
      }
      .card-top-row .course-name {
        flex: 1;
        min-width: 0;
      }
      .low-confidence-badge {
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        background: rgba(217, 119, 6, 0.1);
        color: var(--state-warning);
        font-size: 10px;
        font-weight: var(--font-weight-semibold);
        border-radius: var(--radius-sm);
        padding: 2px 8px;
        line-height: 1.5;
        white-space: nowrap;
        letter-spacing: 0.2px;
      }

      /* ========================================
         Bottom Action Bar — Frosted Glass
         ======================================== */
      .bottom-action-bar {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        max-width: 375px;
        background: rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-top: 1px solid rgba(217, 223, 234, 0.45);
        padding: var(--space-md) var(--space-xl) 28px;
        z-index: 40;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-sm);
      }
      .btn-confirm {
        width: 100%;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--color-brand);
