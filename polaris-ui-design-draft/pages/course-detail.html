<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课程详情 — Polaris课程表</title>
    <style id="theme-vars">
/* ============================================
   Polaris 课程表 — Brand Design Tokens
   ============================================ */

:root {
  /* — Primary Brand — */
  --color-brand: #2563EB;
  --color-brand-hover: #1D4ED8;
  --color-brand-light: #DBEAFE;
  --color-brand-subtle: #EFF6FF;

  /* — Semantic State Colors — */
  --state-success: #059669;
  --state-success-bg: #ECFDF5;
  --state-warning: #D97706;
  --state-warning-bg: #FFFBEB;
  --state-error: #DC2626;
  --state-error-bg: #FEF2F2;
  --state-info: #2563EB;
  --state-info-bg: #EFF6FF;

  /* — Course Palette (by weekday) — */
  --course-mon: #2563EB;
  --course-mon-bg: #EAF2FF;
  --course-tue: #E8645A;
  --course-tue-bg: #FFEDEE;
  --course-wed: #0D9488;
  --course-wed-bg: #EAF8F1;
  --course-thu: #7C3AED;
  --course-thu-bg: #F1EAFE;
  --course-fri: #D97706;
  --course-fri-bg: #FFF3D9;
  --course-sat: #EC4899;
  --course-sat-bg: #FDF2F8;

  /* — Surfaces — */
  --surface-page: #F6F7FB;
  --surface-card: #FFFFFF;
  --surface-elevated: #FFFFFF;
  --surface-overlay: rgba(15, 23, 42, 0.5);

  /* — Text — */
  --text-primary: #172033;
  --text-secondary: #667085;
  --text-tertiary: #98A2B3;
  --text-inverse: #FFFFFF;
  --text-brand: #2563EB;

  /* — Borders — */
  --border-default: #D9DFEA;
  --border-subtle: #E5E7EB;
  --border-brand: #2563EB;

  /* — Typography — */
  --font-family: 'Inter', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
  --font-size-xs: 11px;
  --font-size-sm: 13px;
  --font-size-base: 15px;
  --font-size-lg: 17px;
  --font-size-xl: 20px;
  --font-size-2xl: 24px;
  --font-size-3xl: 28px;
  --line-height-tight: 1.25;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.625;
  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  /* — Radius — */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* — Spacing — */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;
  --space-4xl: 40px;

  /* — Shadow — */
  --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.03);
  --shadow-elevated: 0 4px 12px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.04);
  --shadow-float: 0 10px 25px rgba(0, 0, 0, 0.08), 0 4px 10px rgba(0, 0, 0, 0.04);

  /* — Bottom Nav Height — */
  --nav-height: 64px;
  --status-bar-height: 44px;

  /* — Semantic Aliases (for fill-html-head.mjs) — */
  --text-background: #F6F7FB;
  --text-foreground: #172033;
  --text-card: #FFFFFF;
  --text-border: #D9DFEA;
  --text-muted: #667085;
  --text-radius-sm: 6px;
  --text-radius-md: 10px;
  --text-radius-lg: 14px;

  /* — Schedule Grid — */
  --schedule-time-col: 48px;
  --schedule-day-col: 68px;
  --schedule-row-height: 56px;
  --schedule-gap: 2px;
}

/* — Typography Utility Classes — */
.text-xs { font-size: var(--font-size-xs); line-height: var(--line-height-tight); }
.text-sm { font-size: var(--font-size-sm); line-height: var(--line-height-normal); }
.text-base { font-size: var(--font-size-base); line-height: var(--line-height-normal); }
.text-lg { font-size: var(--font-size-lg); line-height: var(--line-height-normal); }
.text-xl { font-size: var(--font-size-xl); line-height: var(--line-height-tight); }
.text-2xl { font-size: var(--font-size-2xl); line-height: var(--line-height-tight); }
.text-3xl { font-size: var(--font-size-3xl); line-height: var(--line-height-tight); }

.font-medium { font-weight: var(--font-weight-medium); }
.font-semibold { font-weight: var(--font-weight-semibold); }
.font-bold { font-weight: var(--font-weight-bold); }

.text-primary { color: var(--text-primary); }
.text-secondary { color: var(--text-secondary); }
.text-tertiary { color: var(--text-tertiary); }
.text-brand { color: var(--text-brand); }

/* — Color Utility Classes — */
.bg-brand { background-color: var(--color-brand); }
.bg-brand-light { background-color: var(--color-brand-light); }
.bg-brand-subtle { background-color: var(--color-brand-subtle); }
.bg-page { background-color: var(--surface-page); }
.bg-card { background-color: var(--surface-card); }

/* — Radius Utility Classes — */
.rounded-sm { border-radius: var(--radius-sm); }
.rounded-md { border-radius: var(--radius-md); }
.rounded-lg { border-radius: var(--radius-lg); }
.rounded-xl { border-radius: var(--radius-xl); }
.rounded-full { border-radius: var(--radius-full); }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--text-background);
    --color-foreground: var(--text-foreground);
    --color-card: var(--text-card);
    --color-primary: var(--text-primary);
    --color-secondary: var(--text-secondary);
    --color-muted: var(--text-muted);
    --color-border: var(--text-border);
    --radius-sm: var(--text-radius-sm);

  }
  @layer base {
    body { background: var(--text-background); color: var(--text-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--text-background); }
      .text-background { color: var(--text-background); }
      .border-background { border-color: var(--text-background); }
      .ring-background { --tw-ring-color: var(--text-background); }
      .bg-foreground { background-color: var(--text-foreground); }
      .text-foreground { color: var(--text-foreground); }
      .border-foreground { border-color: var(--text-foreground); }
      .ring-foreground { --tw-ring-color: var(--text-foreground); }
      .bg-card { background-color: var(--text-card); }
      .text-card { color: var(--text-card); }
      .border-card { border-color: var(--text-card); }
      .ring-card { --tw-ring-color: var(--text-card); }
      .bg-primary { background-color: var(--text-primary); }
      .text-primary { color: var(--text-primary); }
      .border-primary { border-color: var(--text-primary); }
      .ring-primary { --tw-ring-color: var(--text-primary); }
      .bg-secondary { background-color: var(--text-secondary); }
      .text-secondary { color: var(--text-secondary); }
      .border-secondary { border-color: var(--text-secondary); }
      .ring-secondary { --tw-ring-color: var(--text-secondary); }
      .bg-muted { background-color: var(--text-muted); }
      .text-muted { color: var(--text-muted); }
      .border-muted { border-color: var(--text-muted); }
      .ring-muted { --tw-ring-color: var(--text-muted); }
      .bg-border { background-color: var(--text-border); }
      .text-border { color: var(--text-border); }
      .border-border { border-color: var(--text-border); }
      .ring-border { --tw-ring-color: var(--text-border); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body>
  <!-- Simulated weekly schedule background context -->
  <div class="page-root">
    <div class="schedule-bg">
      <div class="schedule-fake-header">2026 年秋季 · 第 8 周</div>
      <div class="schedule-fake-grid">
        <div class="fake-cell" style="left:22%;top:8%;height:14%;background:var(--course-mon);opacity:0.12;border-radius:6px;"></div>
        <div class="fake-cell" style="left:62%;top:8%;height:14%;background:var(--course-tue);opacity:0.12;border-radius:6px;"></div>
        <div class="fake-cell" style="left:22%;top:30%;height:28%;background:var(--course-mon);opacity:0.18;border-radius:6px;"></div>
        <div class="fake-cell" style="left:82%;top:52%;height:14%;background:var(--course-fri);opacity:0.12;border-radius:6px;"></div>
      </div>
    </div>

    <!-- Dimmed backdrop -->
    <div class="detail-backdrop" data-dom-id="detail-backdrop"></div>

    <!-- Bottom sheet -->
    <div class="bottom-sheet">
      <!-- Drag handle -->
      <div class="drag-handle-bar">
        <div class="drag-handle"></div>
      </div>

      <div class="sheet-body">
        <!-- Gradient header band with course name -->
        <div class="course-header-band">
          <div class="course-header-bg"></div>
          <div class="course-header-content">
            <h2 class="course-name">高等数学</h2>
            <span class="course-name-sub">周一 1-2节 · 教A-301</span>
          </div>
        </div>

        <!-- Info card group -->
        <div class="info-card">
          <!-- Row: 上课时间 -->
          <div class="info-row">
            <div class="info-row-icon">
              <i data-lucide="clock" class="info-icon"></i>
            </div>
            <div class="info-row-body">
              <span class="info-label">上课时间</span>
              <span class="info-value">周一 1-2节</span>
            </div>
          </div>

          <!-- Row: 具体时间 -->
          <div class="info-row">
            <div class="info-row-icon">
              <i data-lucide="timer" class="info-icon"></i>
            </div>
            <div class="info-row-body">
              <span class="info-label">具体时间</span>
              <span class="info-value">08:00 - 09:35</span>
            </div>
          </div>

          <!-- Row: 上课地点 -->
          <div class="info-row">
            <div class="info-row-icon">
              <i data-lucide="map-pin" class="info-icon"></i>
            </div>
            <div class="info-row-body">
              <span class="info-label">上课地点</span>
              <span class="info-value">教A-301</span>
            </div>
          </div>

          <!-- Row: 授课教师 -->
          <div class="info-row">
            <div class="info-row-icon">
              <i data-lucide="user" class="info-icon"></i>
            </div>
            <div class="info-row-body">
              <span class="info-label">授课教师</span>
              <span class="info-value">张明华 教授</span>
            </div>
          </div>

          <!-- Row: 课程类型 -->
          <div class="info-row">
            <div class="info-row-icon">
              <i data-lucide="book-open" class="info-icon"></i>
            </div>
            <div class="info-row-body">
              <span class="info-label">课程类型</span>
              <span class="info-value">讲课</span>
            </div>
          </div>

          <!-- Row: 周次范围 -->
          <div class="info-row">
            <div class="info-row-icon">
              <i data-lucide="calendar-range" class="info-icon"></i>
            </div>
            <div class="info-row-body">
              <span class="info-label">周次范围</span>
              <span class="info-value">第1-16周 (每周)</span>
            </div>
          </div>

          <!-- Row: 学分 -->
          <div class="info-row">
            <div class="info-row-icon">
              <i data-lucide="star" class="info-icon"></i>
            </div>
            <div class="info-row-body">
              <span class="info-label">学分</span>
              <span class="info-value">4.0</span>
            </div>
          </div>

          <!-- Row: 教学班 -->
          <div class="info-row info-row-last">
            <div class="info-row-icon">
              <i data-lucide="users" class="info-icon"></i>
            </div>
            <div class="info-row-body">
              <span class="info-label">教学班</span>
              <span class="info-value">计算机2301-2304</span>
            </div>
          </div>
        </div>

        <!-- Confidence indicator -->
        <div class="confidence-bar">
          <div class="confidence-icon-wrap">
            <i data-lucide="shield-check" class="confidence-icon"></i>
          </div>
          <div class="confidence-text-wrap">
            <span class="confidence-label">解析置信度</span>
            <span class="confidence-detail">高 — 所有字段均已识别</span>
          </div>
        </div>

        <!-- Raw source toggle -->
        <div class="source-toggle">
          <span class="source-toggle-label">查看原始文本</span>
          <i data-lucide="chevron-down" class="source-chevron"></i>
        </div>
        <div class="source-content">
          高等数学(1-2节) 场地:教A-301 教师:张明华
        </div>
      </div>

      <!-- Action buttons -->
      <div class="action-buttons">
        <button class="btn btn-secondary" data-dom-id="detail-close">关闭</button>
        <button class="btn btn-primary">
          <i data-lucide="bell" class="btn-icon"></i>
          添加提醒
        </button>
      </div>
    </div>
  </div>

  <style>
    /* =============================================
       Course Detail Bottom Sheet — Redesigned
       ============================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-family);
      background: var(--surface-page);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Page root (mobile frame) */
    .page-root {
      width: 375px;
      min-height: 100vh;
      position: relative;
      background: var(--surface-page);
      overflow: hidden;
    }

    /* Simulated schedule background */
    .schedule-bg {
      padding: 56px 12px 16px;
      min-height: 100vh;
    }

    .schedule-fake-header {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 16px;
      letter-spacing: -0.01em;
    }

    .schedule-fake-grid {
      position: relative;
      height: 500px;
      background: var(--surface-card);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border-subtle);
      overflow: hidden;
    }

    .fake-cell {
      position: absolute;
    }

    /* Dimmed backdrop */
    .detail-backdrop {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 375px;
      height: 100%;
      background: rgba(15, 23, 42, 0.35);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      z-index: 100;
    }

    /* Bottom sheet */
    .bottom-sheet {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%) translateY(100%);
      width: 375px;
      max-height: 85vh;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border-radius: 24px 24px 0 0;
      box-shadow:
        0 -2px 16px rgba(0, 0, 0, 0.06),
        0 -8px 32px rgba(0, 0, 0, 0.04),
        0 0 0 1px rgba(255, 255, 255, 0.5);
      z-index: 101;
      display: flex;
      flex-direction: column;
      animation: sheetSlideUp 0.38s cubic-bezier(0.22, 1, 0.36, 1) 0.05s forwards;
    }

    @keyframes sheetSlideUp {
      from {
        transform: translateX(-50%) translateY(100%);
        opacity: 0.6;
      }
      to {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }
    }

    /* Drag handle area */
    .drag-handle-bar {
      display: flex;
      justify-content: center;
      padding: 12px 0 0;
      flex-shrink: 0;
    }

    .drag-handle {
      width: 48px;
      height: 4px;
      background: rgba(0, 0, 0, 0.12);
      border-radius: var(--radius-full);
    }

    /* Sheet body (scrollable) */
    .sheet-body {
      overflow-y: auto;
      flex: 1;
      -webkit-overflow-scrolling: touch;
    }

    .sheet-body::-webkit-scrollbar {
      display: none;
    }
    .sheet-body {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Course header band — gradient with course color */
    .course-header-band {
      position: relative;
      margin: 16px 20px 0;
      border-radius: 16px;
      overflow: hidden;
    }

    .course-header-bg {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--course-mon) 0%, #3b82f6 60%, #60a5fa 100%);
      opacity: 0.92;
    }

    .course-header-content {
      position: relative;
      z-index: 1;
      padding: 20px 20px 18px;
    }

    .course-name {
      font-size: 22px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.3;
      letter-spacing: -0.02em;
    }

    .course-name-sub {
      display: inline-block;
      margin-top: 6px;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.78);
      line-height: 1.4;
    }

    /* Info card group */
    .info-card {
      margin: 16px 20px 0;
      background: rgba(255, 255, 255, 0.55);
      border-radius: 16px;
      border: 1px solid rgba(0, 0, 0, 0.04);
    }

    .info-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.04);
      min-height: 48px;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-row-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--course-mon-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .info-icon {
      width: 16px;
      height: 16px;
      color: var(--course-mon);
    }

    .info-row-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .info-label {
      font-size: 11px;
      color: var(--text-tertiary);
      font-weight: 500;
      line-height: 1.3;
      letter-spacing: 0.01em;
    }

    .info-value {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-primary);
      line-height: 1.35;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Confidence bar */
    .confidence-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 12px 20px 0;
      padding: 12px 14px;
      background: rgba(5, 150, 105, 0.06);
      border-radius: 12px;
      border: 1px solid rgba(5, 150, 105, 0.08);
    }

    .confidence-icon-wrap {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--state-success-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .confidence-icon {
      width: 16px;
      height: 16px;
      color: var(--state-success);
    }

    .confidence-text-wrap {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }

    .confidence-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--state-success);
      line-height: 1.3;
    }

    .confidence-detail {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.4;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Raw source toggle */
    .source-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 0;
      cursor: pointer;
      user-select: none;
    }

    .source-toggle-label {
      font-size: 13px;
      color: var(--text-brand);
      font-weight: 500;
      line-height: 1.4;
    }

    .source-chevron {
      width: 16px;
      height: 16px;
      color: var(--text-brand);
    }

    .source-content {
      margin: 8px 20px 0;
      background: rgba(0, 0, 0, 0.02);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 12px;
      color: var(--text-secondary);
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      line-height: 1.6;
      margin-bottom: 8px;
    }

    /* Action buttons */
    .action-buttons {
      display: flex;
      gap: 12px;
      padding: 8px 20px 28px;
      flex-shrink: 0;
    }

    .btn {
      flex: 1;
      height: 48px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      font-family: var(--font-family);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: none;
      outline: none;
      transition: transform 0.12s ease, box-shadow 0.18s ease, background 0.15s ease;
      letter-spacing: -0.01em;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-icon {
      width: 16px;
      height: 16px;
    }
