plugins {
    id "com.android.application"
}

def releaseSigningProperties = new Properties()
def releaseSigningPropertiesFile = rootProject.file("keystore.properties")
if (releaseSigningPropertiesFile.exists()) {
    releaseSigningPropertiesFile.withInputStream { releaseSigningProperties.load(it) }
}

def signingValue = { String propertyName, String environmentName ->
    releaseSigningProperties.getProperty(propertyName) ?: System.getenv(environmentName)
}
def releaseStoreFile = signingValue("storeFile", "POLARIS_RELEASE_STORE_FILE")
def releaseStorePassword = signingValue("storePassword", "POLARIS_RELEASE_STORE_PASSWORD")
def releaseKeyAlias = signingValue("keyAlias", "POLARIS_RELEASE_KEY_ALIAS")
def releaseKeyPassword = signingValue("keyPassword", "POLARIS_RELEASE_KEY_PASSWORD")
def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
        .every { it != null && !it.trim().isEmpty() }

android {
    namespace "com.polaris.timetable"
    compileSdk 35

    testOptions {
        unitTests.returnDefaultValues = true
    }

    defaultConfig {
        applicationId "com.polaris.timetable"
        minSdk 23
        targetSdk 35
        versionCode 11501
        versionName "1.15.1"
    }

    buildFeatures {
        viewBinding true
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "Polaris-${variant.versionName}-${variant.name}.apk"
        }
    }
}

def releaseTaskRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase(Locale.ROOT).contains("release")
}
if (releaseTaskRequested && !hasReleaseSigning) {
    throw new GradleException(
            "Release signing is not configured. Copy keystore.properties.example to " +
                    "keystore.properties and fill it in, or set the POLARIS_RELEASE_* environment variables."
    )
}

configurations.all {
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
}
dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.fragment:fragment:1.8.2"
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.viewpager:viewpager:1.0.0"
    implementation "com.tom-roush:pdfbox-android:2.0.27.0"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}
