name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing formal GitHub Release tag to recover to Gitee
        required: true
        type: string

jobs:
  build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

        # lint 以 error 为失败阈值（当前基线 0 error / 3 条依赖内部警告）；
        # 新增 lint error 会阻塞合并，勿随意抬高警告基线。
      - name: Run unit tests and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon --console=plain

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Polaris-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  instrumented:
    # PR 跑 smoke 快速拦截；push main 跑全量（周切换/旋转/字体缩放等）；
    # tag push 跑更新入口和安装构件 smoke，标签发布依赖仪器验证。
    # 注意：if 必须写单行。多行 plain scalar 的 job 级 if 在 tag push 上
    # 曾被评估为 false，instrumented 被静默跳过而 release 照常发布
    # （v1.24.11 实测），等于绕过了仪器验证；release 的 fail-closed
    # 判断（needs.instrumented.result）即因此补上。
    if: github.event_name != 'workflow_dispatch' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    # 2026-09-01 教训：用例挂死时该 job 曾占用 runner 近 3 小时无输出。
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ubuntu-24.04 runner 镜像的默认用户不在 kvm 组内，导致 /dev/kvm 不可用，
      # 模拟器退化为纯软件模拟（API 35 x86_64 起不来，instrumentation 进程崩溃、
      # "Starting 0 tests"）。这里把 kvm 设备放开给所有用户。
      # 若 runner 镜像后续修复了组归属，可删除本步骤。
      - name: Enable KVM for emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 阶段 1 已闭环（2026-09-01）：三个根因全部定位并修复，本 job 失败会阻塞合并。
      #   ✅ 根因一 EnumEntriesKt —— 4120fb7 注入 kotlin-stdlib（测试 APK 正常构建、用例被发现）
      #   ✅ 根因二 /dev/kvm 无权限 —— 上一步 udev 规则（模拟器 Emulator booted + Starting 10 tests）
      #   ✅ 根因三 主线程永不 idle —— ScheduleBoardView.renderSchedule 原先用零延迟 post() 轮询等待
      #      尺寸，尺寸为 0 时（空课表/板被隐藏）构成消息风暴，使 Espresso.onIdle() 无限阻塞
      #      （表现为 "Tests 0/10 completed" 且无失败无跳过）；已改为 onSizeChanged 事件驱动补渲染。
      #      同期修复 BackdropBlurView 在 onPreDraw 中无条件 invalidate 造成的静止态 60fps 自激重绘。
      #      本机实测：静止时帧增量为 0，10/10 用例通过。
      # 2026-09-05 教训：android-emulator-runner@v2 会把 script 输入按行拆开，
      # 逐行以 `sh -c <行>` 独立执行（其 src/script-parser.ts）。跨行 if/then/fi
      # 与行尾续符 `\` 会被拆碎，上一行设置的变量对下一行不可见——此前
      # main push 的 instrumented job 连续多轮在脚本解析处失败
      # （dash: "Syntax error: end of file unexpected (expecting fi)"）。
      # 因此这里只保留单行调用，分流逻辑在 tools/ci/run-instrumented.sh。
      - name: Run instrumented tests (Espresso)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: sh tools/ci/run-instrumented.sh
  release:
    # 稳定发布流水线。
    # 缺签名 Secret / 指纹不符 / 版本不一致 / 历史清单查询失败时必须失败；
    # Debug/未签名 APK 永远不允许作为 Release 资产上传；
    # 通过 Draft、资产复验和正式发布的原子流程保证 latest 指向的稳定版三资产齐全。
    # fail-closed：instrumented 未真正跑绿（含被跳过）时不得发布。
    # 显式 if 会取代「needs 失败即跳过」的默认行为，跳过的依赖也拦不住发布
    # （v1.24.11 实测 instrumented 跳过、release 照常运行），故在此显式校验。
    if: startsWith(github.ref, 'refs/tags/v') && needs.instrumented.result == 'success'
    needs: [build, instrumented]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_RELEASE_KEY: ${{ secrets.POLARIS_RELEASE_KEYSTORE_B64 != '' }}
      HAS_GITEE_TOKEN: ${{ secrets.GITEE_TOKEN != '' }}
      EXPECTED_CERT_SHA256: ${{ secrets.POLARIS_RELEASE_CERT_SHA256 }}
    steps:
      - name: Require release signing secrets
        if: env.HAS_RELEASE_KEY != 'true'
        run: |
          echo "::error::缺少 POLARIS_RELEASE_KEYSTORE_B64，发布必须使用正式签名，禁止 Debug fallback"
          exit 1

      - name: Require expected certificate fingerprint
        if: env.EXPECTED_CERT_SHA256 == ''
        run: |
          echo "::error::缺少 POLARIS_RELEASE_CERT_SHA256，无法核对发布证书指纹"
          exit 1

      - name: Require Gitee release token
        if: env.HAS_GITEE_TOKEN != 'true'
        run: |
          echo "::error::GITEE_TOKEN 未配置，无法发布 Gitee 更新源"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Run unit tests and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon --console=plain

      - name: Read version from gradle
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName "\K[^"]+' app/build.gradle | head -1)
          VERSION_CODE=$(grep -oP 'versionCode \K\d+' app/build.gradle | head -1)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "版本：$VERSION_NAME ($VERSION_CODE)"

      - name: Verify tag, version mapping and release notes
        run: |
          VERSION_NAME=${{ steps.version.outputs.name }}
          VERSION_CODE=${{ steps.version.outputs.code }}
          TAG="${{ github.ref_name }}"
          if [ "$TAG" != "v$VERSION_NAME" ]; then
            echo "::error::Git 标签 $TAG 与 versionName $VERSION_NAME 不一致"; exit 1
          fi
          MAJOR=$(echo "$VERSION_NAME" | cut -d. -f1)
          MINOR=$(echo "$VERSION_NAME" | cut -d. -f2)
          PATCH=$(echo "$VERSION_NAME" | cut -d. -f3)
          # minor/patch 限 0..99，防止 versionCode 映射碰撞（与客户端和脚本同规则）。
          if [ "$MINOR" -gt 99 ] || [ "$PATCH" -gt 99 ]; then
            echo "::error::minor/patch 必须在 0..99，否则 versionCode 映射碰撞"; exit 1
          fi
          EXPECTED=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          if [ "$VERSION_CODE" -ne "$EXPECTED" ]; then
            echo "::error::versionCode $VERSION_CODE 与映射值 $EXPECTED 不一致"; exit 1
          fi
          if [ "$VERSION_CODE" -le 0 ] || [ "$VERSION_CODE" -gt 2100000000 ]; then
            echo "::error::versionCode $VERSION_CODE 超出 (0, 2100000000]"; exit 1
          fi
          if [ ! -f "docs/releases/$VERSION_NAME.md" ]; then
            echo "::error::缺少 docs/releases/$VERSION_NAME.md（发布说明同时作为 latest.json 来源）"; exit 1
          fi

      - name: Verify versionCode is monotonically increasing
        id: monotonic
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: ${{ github.ref_name }}
          CURRENT_VERSION_NAME: ${{ steps.version.outputs.name }}
          CURRENT_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          # 区分 HTTP 200、404 和网络故障，任何故障不得把上一版本当作 0。
          VERSION_CODE=${{ steps.version.outputs.code }}
          set +e
          HTTP_CODE=$(curl -sSL -o /tmp/prev-latest.json -w '%{http_code}' \
            --connect-timeout 15 --max-time 60 \
            "https://github.com/Jockjrop/PolarisTimetable/releases/latest/download/latest.json")
          CURL_EXIT=$?
          set -e
          if [ $CURL_EXIT -ne 0 ] || [ -z "$HTTP_CODE" ]; then
            echo "::error::查询上一稳定清单失败（curl 退出码 $CURL_EXIT），不得视为首次发布"; exit 1
          fi
          if [ "$HTTP_CODE" = "200" ]; then
            PREVIOUS=$(python3 - <<'PY'
          import json, sys
          with open("/tmp/prev-latest.json", encoding="utf-8") as f:
              d = json.load(f)
          v = d["versionCode"]
          if not isinstance(v, int) or v <= 0:
              sys.exit("上一清单 versionCode 非法")
          print(v)
          PY
          ) || { echo "::error::上一稳定清单解析失败（畸形 JSON 或 versionCode 非法）"; exit 1; }
          LATEST_TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [ "$LATEST_TAG" = "${{ github.ref_name }}" ]; then
            FORMAL=$(gh release view "$LATEST_TAG" --json isDraft,isPrerelease --jq '(.isDraft == false) and (.isPrerelease == false)')
            if [ "$FORMAL" != "true" ]; then
              echo "::error::同 tag Release 不是已发布稳定版"; exit 1
            fi
            mkdir -p build/existing-release
            gh release download "$LATEST_TAG" --dir build/existing-release \
              --pattern 'latest.json' --pattern "Polaris-${{ steps.version.outputs.name }}-release.apk"
            LATEST_TAG="$LATEST_TAG" pwsh -NoProfile -Command 'Import-Module ./tools/release/ReleaseSafety.psm1 -Force; Assert-ReleaseVersionGate -CurrentTag $env:CURRENT_TAG -CurrentVersionName $env:CURRENT_VERSION_NAME -CurrentVersionCode $env:CURRENT_VERSION_CODE -LatestTag $env:LATEST_TAG -LatestManifestPath build/existing-release/latest.json -PublishedApkPath "build/existing-release/Polaris-$($env:CURRENT_VERSION_NAME)-release.apk" | Out-Null'
            echo "SAME_RELEASE=true" >> "$GITHUB_OUTPUT"
            SOURCE="same-formal-release"
            MIN_SUPPORTED=$(python3 -c "import json;print(json.load(open('build/existing-release/latest.json'))['minSupportedVersionCode'])")
          else
            LATEST_TAG="$LATEST_TAG" pwsh -NoProfile -Command 'Import-Module ./tools/release/ReleaseSafety.psm1 -Force; Assert-ReleaseVersionGate -CurrentTag $env:CURRENT_TAG -CurrentVersionName $env:CURRENT_VERSION_NAME -CurrentVersionCode $env:CURRENT_VERSION_CODE -LatestTag $env:LATEST_TAG -LatestManifestPath /tmp/prev-latest.json | Out-Null'
            SOURCE="previous-stable-manifest"
            MIN_SUPPORTED=$PREVIOUS
            echo "SAME_RELEASE=false" >> "$GITHUB_OUTPUT"
          fi
          echo "$SOURCE：最新稳定版 tag=$LATEST_TAG versionCode=$PREVIOUS"
          echo "MIN_SUPPORTED=$MIN_SUPPORTED" >> "$GITHUB_OUTPUT"
          echo "PREVIOUS=$PREVIOUS" >> "$GITHUB_OUTPUT"
          echo "SOURCE=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "MONOTONIC: source=$SOURCE previous=$PREVIOUS new=$VERSION_CODE" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$HTTP_CODE" = "404" ]; then
          # 首次引导分支：仓库尚无 latest.json。基线 12601 为经审计的上一正式版本 1.26.1。
          # 首个稳定版发布后，此分支之外的任何查询故障都必须失败。
          PREVIOUS=12601
          SOURCE="bootstrap-baseline-1.26.1"
          echo "$SOURCE：无稳定清单，按审计基线 previous=$PREVIOUS"
          if [ "$VERSION_CODE" -le "$PREVIOUS" ]; then
            echo "::error::versionCode $VERSION_CODE 未大于 bootstrap 基线 $PREVIOUS"; exit 1
          fi
          echo "MIN_SUPPORTED=$PREVIOUS" >> "$GITHUB_OUTPUT"
          echo "PREVIOUS=$PREVIOUS" >> "$GITHUB_OUTPUT"
          echo "SOURCE=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "SAME_RELEASE=false" >> "$GITHUB_OUTPUT"
          echo "MONOTONIC: source=$SOURCE previous=$PREVIOUS new=$VERSION_CODE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::查询上一稳定清单返回 HTTP $HTTP_CODE（超时/DNS/TLS/5xx/429），阻止发布"; exit 1
          fi

      - name: Decode release keystore
        if: steps.monotonic.outputs.SAME_RELEASE != 'true'
        run: |
          echo "${{ secrets.POLARIS_RELEASE_KEYSTORE_B64 }}" | base64 -d > keystore.jks

      - name: Assemble release APK (signed)
        if: steps.monotonic.outputs.SAME_RELEASE != 'true'
        env:
          POLARIS_RELEASE_STORE_FILE: keystore.jks
          POLARIS_RELEASE_STORE_PASSWORD: ${{ secrets.POLARIS_RELEASE_STORE_PASSWORD }}
          POLARIS_RELEASE_KEY_ALIAS: ${{ secrets.POLARIS_RELEASE_KEY_ALIAS }}
          POLARIS_RELEASE_KEY_PASSWORD: ${{ secrets.POLARIS_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Locate release APK
        id: apk
        run: |
          if [ "${{ steps.monotonic.outputs.SAME_RELEASE }}" = "true" ]; then
            APK_PATH="build/existing-release/Polaris-${{ steps.version.outputs.name }}-release.apk"
          else
            APK_PATH="app/build/outputs/apk/release/Polaris-${{ steps.version.outputs.name }}-release.apk"
          fi
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::未生成正式签名 APK：$APK_PATH"; exit 1
          fi
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature against expected certificate
        run: |
          APK_PATH=${{ steps.apk.outputs.path }}
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH" > /tmp/apksigner.txt
          ACTUAL=$(grep -m1 -oP 'SHA-256 digest: \K[0-9a-fA-F]+' /tmp/apksigner.txt)
          EXPECTED=$(echo "${{ secrets.POLARIS_RELEASE_CERT_SHA256 }}" | tr 'A-F' 'a-f')
          echo "实际证书指纹：$ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK 签名指纹与配置的发布证书不符"; exit 1
          fi

      - name: Verify APK identity with apkanalyzer
        run: |
          APK_PATH=${{ steps.apk.outputs.path }}
          APP_ID=$(apkanalyzer manifest application-id "$APK_PATH" | tail -1)
          APK_CODE=$(apkanalyzer manifest version-code "$APK_PATH" | tail -1)
          APK_NAME=$(apkanalyzer manifest version-name "$APK_PATH" | tail -1)
          if [ "$APP_ID" != "com.polaris.timetable" ]; then
            echo "::error::包名 $APP_ID 不是 com.polaris.timetable"; exit 1
          fi
          if [ "$APK_CODE" != "${{ steps.version.outputs.code }}" ]; then
            echo "::error::APK versionCode $APK_CODE 与 gradle 不一致"; exit 1
          fi
          if [ "$APK_NAME" != "${{ steps.version.outputs.name }}" ]; then
            echo "::error::APK versionName $APK_NAME 与 gradle 不一致"; exit 1
          fi

      - name: Generate latest.json and .sha256
        if: steps.monotonic.outputs.SAME_RELEASE != 'true'
        run: |
          pwsh -NoProfile -File tools/release/generate-update-manifest.ps1 \
            -ApkPath '${{ steps.apk.outputs.path }}' \
            -VersionCode ${{ steps.version.outputs.code }} \
            -VersionName '${{ steps.version.outputs.name }}' \
            -GitTag '${{ github.ref_name }}' \
            -ReleaseNotesPath 'docs/releases/${{ steps.version.outputs.name }}.md' \
            -OutputPath 'build/update-manifest' \
            -MinSupportedVersionCode ${{ steps.monotonic.outputs.MIN_SUPPORTED }}

      - name: Create or update draft release
        if: steps.monotonic.outputs.SAME_RELEASE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release edit "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --notes-file "docs/releases/${{ steps.version.outputs.name }}.md"
          else
            gh release create "${{ github.ref_name }}" \
              --draft \
              --title "${{ github.ref_name }}" \
              --notes-file "docs/releases/${{ steps.version.outputs.name }}.md"
          fi

      - name: Upload draft assets
        if: steps.monotonic.outputs.SAME_RELEASE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            --clobber \
            "${{ steps.apk.outputs.path }}" \
            "build/update-manifest/latest.json" \
            "build/update-manifest/Polaris-${{ steps.version.outputs.name }}-release.apk.sha256"

      - name: Re-verify published or draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 始终从 GitHub Release 重新下载三项资产；同 tag 重跑不使用新构建产物。
          TAG="${{ github.ref_name }}"
          VERSION_NAME=${{ steps.version.outputs.name }}
          VERSION_CODE=${{ steps.version.outputs.code }}
          EXPECTED_SHA256=$(echo "${{ secrets.POLARIS_RELEASE_CERT_SHA256 }}" | tr 'A-F' 'a-f')
          rm -rf /tmp/verify && mkdir -p /tmp/verify && cd /tmp/verify
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --clobber
          COUNT=$(ls -1 | wc -l)
          if [ "$COUNT" -ne 3 ]; then
            echo "::error::Draft 资产数量 $COUNT != 3（APK/.sha256/latest.json）"; exit 1
          fi
          APK_FILE="Polaris-$VERSION_NAME-release.apk"
          if [ ! -f "$APK_FILE" ] || [ ! -f "$APK_FILE.sha256" ] || [ ! -f "latest.json" ]; then
            echo "::error::Draft 缺少必要资产"; ls -la; exit 1
          fi
          EXPECTED_SIZE=$(python3 -c "import json;print(json.load(open('latest.json'))['apk']['size'])")
          ACTUAL_SIZE=$(stat -c%s "$APK_FILE")
          if [ "$ACTUAL_SIZE" != "$EXPECTED_SIZE" ]; then
            echo "::error::Draft APK 字节数 $ACTUAL_SIZE 与清单 $EXPECTED_SIZE 不一致"; exit 1
          fi
          echo "$EXPECTED_SIZE $APK_FILE" > /tmp/size.ref
          RECORDED=$(cut -d' ' -f1 "$APK_FILE.sha256")
          ACTUAL_SHA=$(sha256sum "$APK_FILE" | cut -d' ' -f1)
          if [ "$RECORDED" != "$ACTUAL_SHA" ]; then
            echo "::error::Draft APK SHA-256 与 .sha256 资产不符"; exit 1
          fi
          python3 - "$VERSION_CODE" "$VERSION_NAME" <<'PY' || exit 1
          import json, sys
          with open("latest.json", encoding="utf-8") as f:
              d = json.load(f)
          checks = [
              ("schemaVersion", 1), ("channel", "stable"),
              ("packageName", "com.polaris.timetable"),
              ("versionCode", int(sys.argv[1])),
              ("versionName", sys.argv[2]),
              ("apk.fileName", f"Polaris-{sys.argv[2]}-release.apk"),
          ]
          for path, want in checks:
              node = d
              for key in path.split("."):
                  node = node[key]
              if node != want:
                  sys.exit(f"latest.json 字段 {path} != {want}（实际 {node}）")
          PY
          # 清单内嵌 sha256 与 .sha256 资产、实际文件三方一致
          EMBEDDED=$(python3 -c "import json;print(json.load(open('latest.json'))['apk']['sha256'])")
          if [ "$EMBEDDED" != "$ACTUAL_SHA" ] || [ "$EMBEDDED" != "$RECORDED" ]; then
            echo "::error::三方 SHA-256 不一致：清单=$EMBEDDED 记录=$RECORDED 实际=$ACTUAL_SHA"; exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs "$APK_FILE" | grep -q "SHA-256 digest:" \
            || { echo "::error::Draft APK 签名校验失败"; exit 1; }
          APP_ID=$(apkanalyzer manifest application-id "$APK_FILE" | tail -1)
          if [ "$APP_ID" != "com.polaris.timetable" ]; then
            echo "::error::Draft APK 包名不符"; exit 1
          fi
          echo "GitHub Release 三资产复验通过：$APK_FILE ($ACTUAL_SIZE bytes, sha256=$ACTUAL_SHA)"

      # Gitee 是第二发布目标：GitHub 正式发布完成后才同步，
      # Gitee 故障不得阻断或回滚已完成的 GitHub 稳定发布（脚本幂等，可重跑补发）。
      - name: Publish draft as stable release
        if: steps.monotonic.outputs.SAME_RELEASE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 原子切换：publish 后 latest 路径立即指向三资产齐全的正式版。
          gh release edit "${{ github.ref_name }}" --draft=false --latest

      - name: Publish same APK to Gitee Release
        id: gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          EXPECTED_COMMIT=$(git rev-list -n 1 "${{ github.ref_name }}")
          pwsh -NoProfile -File tools/release/publish-gitee-release.ps1 \
            -Owner 'Jockjrop' \
            -Repo 'polaris-course-schedule' \
            -Tag '${{ github.ref_name }}' \
            -ExpectedCommitSha "$EXPECTED_COMMIT" \
            -ApkPath '/tmp/verify/Polaris-${{ steps.version.outputs.name }}-release.apk' \
            -GitHubManifestPath '/tmp/verify/latest.json' \
            -ReleaseNotesPath 'docs/releases/${{ steps.version.outputs.name }}.md' \
            -OutputPath 'build/update-manifest-gitee'

      - name: Verify Gitee assets anonymously
        run: |
          # 不携带 Cookie 或 Token，模拟正式客户端访问。
          MANIFEST_TYPE=$(curl -fsSL --cookie '' --connect-timeout 10 --max-time 60 \
            -H 'Accept: application/json' -o /tmp/gitee-latest.json \
            -w '%{content_type}' '${{ steps.gitee.outputs.manifest_url }}')
          case "$MANIFEST_TYPE" in
            application/json*|text/plain*|application/octet-stream*) ;;
            *) echo "::error::Gitee latest.json Content-Type 异常：$MANIFEST_TYPE"; exit 1 ;;
          esac
          python3 -m json.tool /tmp/gitee-latest.json >/dev/null \
            || { echo "::error::Gitee latest.json 不是有效 JSON"; exit 1; }
          curl -fsSL --cookie '' --connect-timeout 10 --max-time 300 \
            -o /tmp/gitee-release.apk '${{ steps.gitee.outputs.apk_url }}'
          EXPECTED_SIZE=$(python3 -c "import json;print(json.load(open('/tmp/gitee-latest.json'))['apk']['size'])")
          EXPECTED_SHA=$(python3 -c "import json;print(json.load(open('/tmp/gitee-latest.json'))['apk']['sha256'])")
          ACTUAL_SIZE=$(stat -c%s /tmp/gitee-release.apk)
          ACTUAL_SHA=$(sha256sum /tmp/gitee-release.apk | cut -d' ' -f1)
          if [ "$ACTUAL_SIZE" != "$EXPECTED_SIZE" ] || [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Gitee 匿名下载 APK 与清单身份不一致"; exit 1
          fi
          if [ "$ACTUAL_SHA" != "$(sha256sum '/tmp/verify/Polaris-${{ steps.version.outputs.name }}-release.apk' | cut -d' ' -f1)" ]; then
            echo "::error::GitHub/Gitee 未使用同一个 APK"; exit 1
          fi

      - name: Remove temporary keystore
        if: always()
        run: rm -f keystore.jks

  recover-gitee-release:
    name: Recover existing GitHub Release to Gitee
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      EXPECTED_CERT_SHA256: ${{ secrets.POLARIS_RELEASE_CERT_SHA256 }}
    steps:
      - name: Require recovery secrets
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::GITEE_TOKEN 未配置"; exit 1
          fi
          if [ -z "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::POLARIS_RELEASE_CERT_SHA256 未配置"; exit 1
          fi

      - name: Checkout recovery scripts from main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up JDK 17 for APK verification
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download and validate formal GitHub Release
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ! echo "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::release_tag 必须为 v<major>.<minor>.<patch>"; exit 1
          fi
          FORMAL=$(gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease \
            --jq '(.tagName == env.RELEASE_TAG) and (.isDraft == false) and (.isPrerelease == false)')
          if [ "$FORMAL" != "true" ]; then
            echo "::error::$RELEASE_TAG 不是已发布的正式 GitHub Release"; exit 1
          fi
          rm -rf build/recovery && mkdir -p build/recovery
          gh release download "$RELEASE_TAG" --dir build/recovery --clobber
          gh release view "$RELEASE_TAG" --json body --jq .body > build/recovery/release-notes.md
          COUNT=$(find build/recovery -maxdepth 1 -type f ! -name release-notes.md | wc -l)
          if [ "$COUNT" -ne 3 ]; then
            echo "::error::GitHub Release 资产数量 $COUNT != 3"; exit 1
          fi
          VERSION_NAME="${RELEASE_TAG#v}"
          APK_PATH="build/recovery/Polaris-$VERSION_NAME-release.apk"
          SHA_PATH="$APK_PATH.sha256"
          MANIFEST_PATH="build/recovery/latest.json"
          for FILE in "$APK_PATH" "$SHA_PATH" "$MANIFEST_PATH"; do
            if [ ! -f "$FILE" ]; then echo "::error::GitHub Release 缺少 $FILE"; exit 1; fi
          done
          VERSION_CODE=$(python3 -c "import json;print(json.load(open('$MANIFEST_PATH'))['versionCode'])")
          RELEASE_TAG="$RELEASE_TAG" VERSION_NAME="$VERSION_NAME" VERSION_CODE="$VERSION_CODE" APK_PATH="$APK_PATH" \
            pwsh -NoProfile -Command 'Import-Module ./tools/release/ReleaseSafety.psm1 -Force; Assert-ReleaseVersionGate -CurrentTag $env:RELEASE_TAG -CurrentVersionName $env:VERSION_NAME -CurrentVersionCode $env:VERSION_CODE -LatestTag $env:RELEASE_TAG -LatestManifestPath build/recovery/latest.json -PublishedApkPath $env:APK_PATH | Out-Null'
          RECORDED=$(cut -d' ' -f1 "$SHA_PATH")
          ACTUAL_SHA=$(sha256sum "$APK_PATH" | cut -d' ' -f1)
          if [ "$RECORDED" != "$ACTUAL_SHA" ]; then
            echo "::error::GitHub Release APK 与 .sha256 不一致"; exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH" > /tmp/recovery-apksigner.txt
          ACTUAL_CERT=$(grep -m1 -oP 'SHA-256 digest: \K[0-9a-fA-F]+' /tmp/recovery-apksigner.txt)
          if [ "$ACTUAL_CERT" != "$(echo "$EXPECTED_CERT_SHA256" | tr 'A-F' 'a-f')" ]; then
            echo "::error::GitHub Release APK 签名指纹不符"; exit 1
          fi
          APP_ID=$(apkanalyzer manifest application-id "$APK_PATH" | tail -1)
          APK_CODE=$(apkanalyzer manifest version-code "$APK_PATH" | tail -1)
          APK_NAME=$(apkanalyzer manifest version-name "$APK_PATH" | tail -1)
          if [ "$APP_ID" != "com.polaris.timetable" ] || [ "$APK_CODE" != "$VERSION_CODE" ] || [ "$APK_NAME" != "$VERSION_NAME" ]; then
            echo "::error::GitHub Release APK 包名或版本不符"; exit 1
          fi
          EXPECTED_COMMIT=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "expected_commit=$EXPECTED_COMMIT" >> "$GITHUB_OUTPUT"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "manifest_path=$MANIFEST_PATH" >> "$GITHUB_OUTPUT"

      - name: Publish existing GitHub assets to Gitee only
        id: gitee
        run: |
          pwsh -NoProfile -File tools/release/publish-gitee-release.ps1 \
            -Owner 'Jockjrop' \
            -Repo 'polaris-course-schedule' \
            -Tag '${{ steps.release.outputs.tag }}' \
            -ExpectedCommitSha '${{ steps.release.outputs.expected_commit }}' \
            -ApkPath '${{ steps.release.outputs.apk_path }}' \
            -GitHubManifestPath '${{ steps.release.outputs.manifest_path }}' \
            -ReleaseNotesPath 'build/recovery/release-notes.md' \
            -OutputPath 'build/update-manifest-gitee'

      - name: Verify recovered Gitee assets anonymously
        run: |
          curl -fsSL --cookie '' --connect-timeout 10 --max-time 60 \
            -o /tmp/gitee-latest.json '${{ steps.gitee.outputs.manifest_url }}'
          python3 -m json.tool /tmp/gitee-latest.json >/dev/null
          curl -fsSL --cookie '' --connect-timeout 10 --max-time 300 \
            -o /tmp/gitee-release.apk '${{ steps.gitee.outputs.apk_url }}'
          EXPECTED_SIZE=$(python3 -c "import json;print(json.load(open('/tmp/gitee-latest.json'))['apk']['size'])")
          EXPECTED_SHA=$(python3 -c "import json;print(json.load(open('/tmp/gitee-latest.json'))['apk']['sha256'])")
          ACTUAL_SIZE=$(stat -c%s /tmp/gitee-release.apk)
          ACTUAL_SHA=$(sha256sum /tmp/gitee-release.apk | cut -d' ' -f1)
          GITHUB_SHA=$(sha256sum '${{ steps.release.outputs.apk_path }}' | cut -d' ' -f1)
          if [ "$ACTUAL_SIZE" != "$EXPECTED_SIZE" ] || [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ] || [ "$ACTUAL_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Gitee 匿名下载资产与 GitHub 正式 APK 不一致"; exit 1
          fi
